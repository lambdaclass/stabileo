packages:
  - caddy
  - postgresql
  - postgresql-client
  - curl
  - rsync
  - gnupg
  - ca-certificates
  - unattended-upgrades
  - util-linux
  - xz-utils
  - zstd

users:
  - default
  - name: app
    gecos: Stabileo deploy and service user
    shell: /bin/bash
    lock_passwd: true
    groups: [systemd-journal]
    ssh_authorized_keys:
      - __DEPLOY_PUBKEY__
    sudo:
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl start stabileo-backend"
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl stop stabileo-backend"
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl restart stabileo-backend"
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl status stabileo-backend"
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl reload caddy"
      - "ALL=(root) NOPASSWD: /usr/bin/caddy validate --config /srv/stabileo/caddy/Caddyfile.next --adapter caddyfile --envfile /etc/caddy/stabileo.env"
      - "ALL=(root) NOPASSWD: /usr/bin/install -m 0644 -o root -g root /srv/stabileo/caddy/Caddyfile.next /etc/caddy/Caddyfile"

# defer: written after the packages, or dpkg keeps the package's Caddyfile over this one.
write_files:
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    defer: true
    content: |
      {
      	log {
      		format console
      		output stdout
      		level INFO
      		include http.log.access
      	}
      }

      import /etc/caddy/sites.d/*.caddy

      (common) {
      	encode zstd gzip

      	header {
      		X-Content-Type-Options "nosniff"
      		Referrer-Policy "strict-origin-when-cross-origin"
      		Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
      		-Server
      	}
      	# Snapshots (/@<commit>/, below) are never indexed: each page's canonical names the latest site.
      	@notSnapshot not path /@*
      	header @notSnapshot X-Robots-Tag "{$ROBOTS_TAG}"
      	header /@* X-Robots-Tag "noindex"

      	handle /api/* {
      		reverse_proxy 127.0.0.1:{$BACKEND_PORT:4100}
      	}
      }

      {$APP_DOMAIN} {
      	root * {$STABILEO_ROOT}/live/frontends/app
      	import common

      	# The sitemap and canonicals carry only the slashed form; /en must answer 301, not 200.
      	@dirNoSlash {
      		not path */
      		file {path}/index.html
      	}
      	redir @dirNoSlash {path}/ 301

      	redir /@* https://snapshots.{$APP_DOMAIN}{uri} 308

      	@static path_regexp \.
      	handle @static {
      		@assets path /assets/*
      		header @assets Cache-Control "public, max-age=31536000, immutable"
      		@html path *.html
      		header @html Cache-Control "no-cache"
      		file_server
      	}

      	handle {
      		header Cache-Control "no-cache"
      		try_files {path} {path}/index.html /index.html
      		file_server
      	}
      }

      {$ADMIN_DOMAIN} {
      	root * {$STABILEO_ROOT}/live/frontends/admin
      	import common

      	@static path_regexp \.
      	handle @static {
      		@assets path /assets/*
      		header @assets Cache-Control "public, max-age=31536000, immutable"
      		@html path *.html
      		header @html Cache-Control "no-cache"
      		file_server
      	}

      	handle {
      		header Cache-Control "no-cache"
      		try_files {path} /admin.html
      		file_server
      	}
      }

      https://snapshots.{$APP_DOMAIN} {
      	encode zstd gzip
      	header {
      		X-Content-Type-Options "nosniff"
      		X-Robots-Tag "noindex"
      		Referrer-Policy "no-referrer"
      		Permissions-Policy "document-domain=(), camera=(), microphone=(), geolocation=(), payment=()"
      		Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      		-Server
      	}
      	# Snapshots: the site as built at a commit, kept forever under /@<first 7 of the commit>/
      	# (docs/DEPLOY.md "Snapshots"). Files never change once written, so they are cached for good;
      	# a snapshot that does not exist is a plain 404, not cached. /@/ is the index (JSON).
      	redir /@ /@/ 301
      	handle /@/ {
      		root * {$STABILEO_ROOT}/snapshots
      		header Access-Control-Allow-Origin "https://{$APP_DOMAIN}"
      		rewrite * /index.json
      		header Cache-Control "no-cache"
      		file_server
      	}

      	@snapshotAsset path_regexp asset ^/@([0-9a-f]{7})/assets/([A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)$
      	handle @snapshotAsset {
      		root * {$STABILEO_ROOT}/snapshots
      		route {
      			@absentSnapshot not file /{re.asset.1}/SNAPSHOT.json
      			respond @absentSnapshot 404
      			@availableAsset file {
      				try_files /{re.asset.1}/assets/{re.asset.2} /assets/{re.asset.2}
      			}
      			handle @availableAsset {
      				header Cache-Control "public, max-age=31536000, immutable"
      				rewrite * {file_match.relative}
      				file_server
      			}
      			respond 404
      		}
      	}
      	@invalidSnapshotAsset path_regexp ^/@[0-9a-f]{7}/assets(?:/|$)
      	handle @invalidSnapshotAsset {
      		respond 404
      	}

      	@snapshot path_regexp snap ^/@([0-9a-f]{7})(/.*)?$
      	handle @snapshot {
      		root * {$STABILEO_ROOT}/snapshots/{re.snap.1}
      		route {
      			@bare path_regexp ^/@[0-9a-f]{7}$
      			redir @bare {path}/ 301
      			@snapDirNoSlash {
      				not path */
      				file {re.snap.2}/index.html
      			}
      			redir @snapDirNoSlash {path}/ 301
      			# A missing file is a 404, as on the plain site; only page addresses fall back to the app.
      			@snapMissingFile {
      				path_regexp \.[^/]*$
      				not file {re.snap.2}
      			}
      			respond @snapMissingFile 404
      			@found file {
      				try_files {re.snap.2} {re.snap.2}/index.html /index.html
      			}
      			header @found Cache-Control "public, max-age=31536000, immutable"
      			rewrite @found {file_match.relative}
      			file_server
      		}
      	}

      	@invalidSnapshot path /@*
      	handle @invalidSnapshot {
      		respond 404
      	}

      	handle {
      		respond 404
      	}
      }
  - path: /etc/caddy/stabileo.env
    permissions: "0644"
    defer: true
    content: |
      APP_DOMAIN=stabileo.com
      ADMIN_DOMAIN=admin.stabileo.com
      STABILEO_ROOT=/srv/stabileo
      BACKEND_PORT=4100
      ROBOTS_TAG=all
  - path: /etc/caddy/sites.d/www-redirect.caddy
    permissions: "0644"
    defer: true
    content: |
      www.stabileo.com {
      	redir https://stabileo.com{uri} permanent
      }
  - path: /etc/systemd/system/caddy.service.d/stabileo.conf
    permissions: "0644"
    defer: true
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/stabileo.env
  - path: /etc/systemd/system/stabileo-backend.service
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Stabileo backend (Phoenix release)
      After=network-online.target postgresql.service
      Wants=network-online.target

      [Service]
      Type=exec
      User=app
      Group=app
      WorkingDirectory=/srv/stabileo/live/backend
      EnvironmentFile=/srv/stabileo/live/.env
      Environment=HOME=/srv/stabileo LANG=C.UTF-8 LC_ALL=C.UTF-8
      # No distribution: `bin/stabileo stop` would not reach the node, so the unit stops it with SIGTERM.
      Environment=RELEASE_DISTRIBUTION=none
      # The release writes its generated sys.config and vm.args here; the release dir is read-only below.
      Environment=RELEASE_TMP=/run/stabileo-backend
      RuntimeDirectory=stabileo-backend
      ExecStart=/srv/stabileo/live/backend/bin/stabileo start
      KillSignal=SIGTERM
      KillMode=mixed
      TimeoutStopSec=30
      Restart=always
      RestartSec=5
      LimitNOFILE=65536
      UMask=0077

      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictNamespaces=yes
      LockPersonality=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      SystemCallArchitectures=native
      SystemCallFilter=@system-service
      # No MemoryDenyWriteExecute: the OTP JIT needs writable and executable pages.

      [Install]
      WantedBy=multi-user.target
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  - mkdir -p /srv/stabileo/releases /srv/stabileo/gcroots /srv/stabileo/caddy /srv/stabileo/incoming /etc/caddy/sites.d
  - chown -R app:app /srv/stabileo
  - chmod 0755 /srv/stabileo
  - sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE stabileo LOGIN PASSWORD '__DB_PASSWORD__' CREATEDB;"
  - sudo -u postgres psql -v ON_ERROR_STOP=1 -c "GRANT pg_signal_backend TO stabileo;"
  - sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE stabileo OWNER stabileo;"
  - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix -o /root/nix-installer.sh
  - sh /root/nix-installer.sh install linux --no-confirm
  # Determinate Nix regenerates nix.conf; only nix.custom.conf survives.
  - printf '\nextra-trusted-public-keys = __NIX_TRUSTED_KEY__\n' >> /etc/nix/nix.custom.conf
  - systemctl restart nix-daemon
  - systemctl daemon-reload
  - systemctl enable stabileo-backend
  - systemctl enable --now caddy
  - systemctl restart caddy
  - echo "stabileo cloud-init done" > /srv/stabileo/cloud-init-done

final_message: "stabileo production host ready after $UPTIME seconds"
