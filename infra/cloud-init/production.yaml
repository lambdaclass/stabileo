#cloud-config
# Hetzner user data for the production host (Debian 13), rendered by infra/cloud-init/render.py.
# Replace before pasting:
#   __DEPLOY_PUBKEY__    public half of DEPLOY_SSH_KEY
#   __DB_PASSWORD__      password in DATABASE_URL (ecto://stabileo:<it>@localhost/stabileo)
#   __NIX_TRUSTED_KEY__  public half of NIX_SIGNING_KEY
# Open 22, 80 and 443 in the Hetzner Cloud Firewall. See docs/DEPLOY.md.

hostname: prod-stabileo
timezone: UTC
package_update: true
package_upgrade: true

