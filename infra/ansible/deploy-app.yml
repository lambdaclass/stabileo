- name: Deploy stabileo (artifact-based deployment)
  hosts: app

  vars_files:
    - vars.yml

  vars:
    artifact_path: "{{ incoming_dir }}/stabileo-release-{{ commit_sha }}.tar.gz"
    tmp_dir: "{{ app_root }}/tmp-{{ commit_sha }}"

  tasks:
    - name: Verify commit_sha is set
      fail:
        msg: "commit_sha must be set"
      when: commit_sha is not defined

    - name: Verify the required runtime settings are set
      fail:
        msg: "{{ item }} must be set"
      when: lookup('env', item) | length == 0
      loop: "{{ required_env }}"

    - name: Verify artifact exists
      stat:
        path: "{{ artifact_path }}"
      register: artifact_stat
      failed_when: not artifact_stat.stat.exists

    - name: Create temp directory
      file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: '0755'

    - name: Extract release artifact
      unarchive:
        src: "{{ artifact_path }}"
        dest: "{{ tmp_dir }}"
        remote_src: yes

    # Before anything changes: a snapshot that cannot be installed (a different commit already
    # holds its prefix, or the disk is short) stops the deploy here, not after the swap.
    - name: Check this release's snapshot can be installed
      shell: |
        set -euo pipefail
        meta={{ tmp_dir }}/snapshot/SNAPSHOT.json
        [ -f "$meta" ] || { echo "no snapshot"; exit 0; }
        commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$meta")
        [ "$commit" = "{{ commit_sha }}" ] || { echo "the snapshot is of $commit, the release of {{ commit_sha }}"; exit 1; }
        dest={{ snapshots_dir }}/${commit:0:7}
        if [ -f "$dest/SNAPSHOT.json" ]; then
          have=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$dest/SNAPSHOT.json")
          [ "$have" = "$commit" ] || { echo "$dest already holds $have"; exit 1; }
        fi
        need=$(( $(du -sm {{ tmp_dir }}/snapshot | cut -f1) + {{ snapshot_min_free_mb }} ))
        free=$(df -Pm {{ app_root }} | awk 'NR==2 {print $4}')
        [ "$free" -ge "$need" ] || { echo "only $free MB free; the snapshot needs $need MB with the reserve"; exit 1; }
      args:
        executable: /bin/bash

    # The daemon admits only paths signed by the trusted key: never pass --no-check-sigs.
    - name: Import the release's signed Nix closure
      shell: |
        set -euo pipefail
        xargs {{ nix_bin }}/nix --extra-experimental-features nix-command \
          copy --from "file://{{ tmp_dir }}/nix-cache" < {{ tmp_dir }}/store-paths.txt
      args:
        executable: /bin/bash

    - name: Pin the closure against garbage collection
      shell: |
        set -euo pipefail
        mkdir -p {{ gcroots_dir }}/{{ commit_sha }}
        while read -r p; do
          {{ nix_bin }}/nix-store --realise "$p" --add-root "{{ gcroots_dir }}/{{ commit_sha }}/$(basename "$p")" > /dev/null
        done < {{ tmp_dir }}/store-paths.txt
        rm -rf {{ tmp_dir }}/nix-cache
      args:
        executable: /bin/bash

    - name: Create .env file
      template:
        src: templates/env.j2
        dest: "{{ tmp_dir }}/.env"
        mode: '0600'

    - name: Let Caddy read the frontends
      shell: |
        find {{ tmp_dir }} -type d -exec chmod o+x {} \;
        find {{ tmp_dir }}/frontends -type f -exec chmod o+r {} \;
      args:
        executable: /bin/bash

    - name: Preflight - validate the new release boots its runtime config
      shell: |
        cd {{ tmp_dir }}
        set -a && source .env && set +a
        RELEASE_DISTRIBUTION=none ./backend/bin/stabileo eval ":ok"
      args:
        executable: /bin/bash

    - name: Stage the Caddyfile
      copy:
        src: "{{ tmp_dir }}/caddy/Caddyfile"
        dest: "{{ caddy_dir }}/Caddyfile.next"
        remote_src: yes
        mode: '0644'

    - name: Validate the Caddyfile
      command: sudo -n /usr/bin/caddy validate --config {{ caddy_dir }}/Caddyfile.next --adapter caddyfile --envfile /etc/caddy/stabileo.env

    - name: Install the Caddyfile
      command: sudo -n /usr/bin/install -m 0644 -o root -g root {{ caddy_dir }}/Caddyfile.next /etc/caddy/Caddyfile

    - name: Reload Caddy
      command: sudo -n /usr/bin/systemctl reload caddy

    - name: Stop the backend service
      command: sudo -n /usr/bin/systemctl stop {{ service_name }}
      ignore_errors: yes

    - name: Run database migrations
      shell: |
        cd {{ tmp_dir }}
        set -a && source .env && set +a
        RELEASE_DISTRIBUTION=none ./backend/bin/stabileo eval "StabileoRepo.Release.migrate()"
      args:
        executable: /bin/bash

    - name: Create releases directory
      file:
        path: "{{ releases_dir }}"
        state: directory
        mode: '0755'

    - name: Check if current deployment exists
      stat:
        path: "{{ deploy_dir }}"
      register: current_deploy

    - name: Create backup name
      set_fact:
        backup_name: "stabileo-{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}-{{ commit_sha[:8] }}"
      when: current_deploy.stat.exists

    - name: Keep the current deployment as the rollback target
      command: mv {{ deploy_dir }} {{ releases_dir }}/{{ backup_name }}
      when: current_deploy.stat.exists

    - name: Install new deployment (atomic swap)
      command: mv {{ tmp_dir }} {{ deploy_dir }}

    - name: Start the backend service
      command: sudo -n /usr/bin/systemctl start {{ service_name }}

    - name: Wait for backend port to be ready
      wait_for:
        port: "{{ backend_port | int }}"
        host: 127.0.0.1
        timeout: 60

    - name: Health check
      uri:
        url: "http://127.0.0.1:{{ backend_port }}/api/v1/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 15
      delay: 2
      until: health_check.status == 200

    # Moved, not copied, out of the release (it would otherwise ride along in every kept release),
    # then made read-only. An existing snapshot of the same commit is kept as it is.
    - name: Install this commit's snapshot, never overwriting one
      shell: |
        set -euo pipefail
        mkdir -p {{ snapshots_dir }}
        chmod 0755 {{ snapshots_dir }}
        src={{ deploy_dir }}/snapshot
        [ -f "$src/SNAPSHOT.json" ] || { rm -rf "$src"; echo "no snapshot in this release"; exit 0; }
        short={{ commit_sha[:7] }}
        dest={{ snapshots_dir }}/$short
        if [ -e "$dest" ]; then
          rm -rf "$src"
          echo "kept the existing $dest"
          exit 0
        fi
        # Files identical to those of the newest snapshot (the engine WASM when it did not change, fonts,
        # images, unchanged chunks) become hard links to them: about 40 MB a snapshot, 15 MB new.
        prev=$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["snapshots"]; print(s[0]["short"] if s else "")' {{ snapshots_dir }}/index.json 2>/dev/null || true)
        if [ -n "$prev" ] && [ -d "{{ snapshots_dir }}/$prev" ]; then
          (cd "$src" && find . -type f) | while read -r f; do
            old="{{ snapshots_dir }}/$prev/$f"
            if [ -f "$old" ] && cmp -s "$src/$f" "$old"; then ln -f "$old" "$src/$f"; fi
          done
        fi
        chmod -R u+rwX,go+rX,go-w "$src"
        mv "$src" "{{ snapshots_dir }}/.incoming-$short"
        mv "{{ snapshots_dir }}/.incoming-$short" "$dest"
        chmod -R a-w "$dest"
        echo "installed $dest ($(du -sh "$dest" | cut -f1))"
      args:
        executable: /bin/bash
      register: snapshot_install

    - name: Write the snapshot index (/@/)
      shell: |
        set -euo pipefail
        python3 - {{ snapshots_dir }} <<'PY'
        import json, os, sys
        from datetime import datetime
        root = sys.argv[1]
        items = []
        for d in os.listdir(root):
            meta = os.path.join(root, d, 'SNAPSHOT.json')
            if d.startswith('.') or not os.path.isfile(meta):
                continue
            m = json.load(open(meta))
            items.append({'short': m['short'], 'commit': m['commit'], 'date': m['date'], 'url': m['prefix'], 'research': m.get('research', []), **{k: m[k] for k in ('experimentVersions', 'engineWasmSha256', 'researchWasmSha256') if k in m}})
        items.sort(key=lambda m: datetime.fromisoformat(m['date']), reverse=True)
        tmp = os.path.join(root, '.index.json.tmp')
        with open(tmp, 'w') as f:
            json.dump({'snapshots': items}, f, indent=1)
            f.write('\n')
        os.chmod(tmp, 0o644)
        os.replace(tmp, os.path.join(root, 'index.json'))
        print(len(items), 'snapshots')
        PY
        du -sh {{ snapshots_dir }}
      args:
        executable: /bin/bash

    - name: Cleanup old releases (keep {{ max_releases }})
      shell: |
        cd {{ releases_dir }}
        ls -t | tail -n +{{ max_releases + 1 }} | while read -r dir; do
          rm -rf -- "$dir"
        done
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Unpin closures no kept release needs
      shell: |
        cd {{ gcroots_dir }}
        ls -t | tail -n +{{ max_releases + 2 }} | while read -r dir; do
          rm -rf -- "$dir"
        done
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Cleanup artifact
      file:
        path: "{{ artifact_path }}"
        state: absent

    - name: Deploy complete
      debug:
        msg: |
          Deploy successful! Health check passed.
          Commit: {{ commit_sha }}
          Current: {{ deploy_dir }}
          Backup: {{ backup_name | default('none (first deploy)') }}
          Snapshot: {{ snapshot_install.stdout | default('none') }}
