name: "Browser system dependencies"
description: "Install Playwright's system packages on a hosted runner, keeping the downloaded packages in the Actions cache"

inputs:
  browsers:
    description: "Space-separated Playwright browsers"
    required: true
  playwright-directory:
    description: "Directory containing the pinned Playwright installation"
    default: web
  use-nix:
    description: "Run the helper in the repository Nix shell"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Package cache key
      id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_DIRECTORY: ${{ inputs.playwright-directory }}
        USE_NIX: ${{ inputs.use-nix }}
      run: |
        helper=(python3)
        if [[ "$USE_NIX" == true ]]; then helper=(nix develop --command python3); fi
        "${helper[@]}" .github/scripts/browser-deps.py --playwright-directory "$PLAYWRIGHT_DIRECTORY" key $BROWSERS
    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - name: Install browser system dependencies
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_DIRECTORY: ${{ inputs.playwright-directory }}
        USE_NIX: ${{ inputs.use-nix }}
      run: |
        helper=(python3)
        if [[ "$USE_NIX" == true ]]; then helper=(nix develop --command python3); fi
        .github/scripts/retry-infra.sh "${helper[@]}" .github/scripts/browser-deps.py --playwright-directory "$PLAYWRIGHT_DIRECTORY" install $BROWSERS
    - name: Prepare downloaded packages for the cache
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEBS: ${{ steps.key.outputs.dir }}
      run: |
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
        ls "$DEBS" | grep -c '\.deb$' || true
    - name: Save downloaded packages
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
