name: "Browser system dependencies"
description: "Install Playwright's system packages on a hosted runner, keeping the downloaded packages in the Actions cache"

inputs:
  browsers:
    description: "Space-separated Playwright browsers"
    required: true

runs:
  using: "composite"
  steps:
    - name: Package cache key
      id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        echo "dir=$HOME/.cache/browser-debs" >> "$GITHUB_OUTPUT"
        echo "key=browser-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}-${BROWSERS// /-}-$(sha256sum web/package-lock.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    # apt reads the packages from this directory and leaves new downloads there for the save below.
    - name: Point apt at the package cache
      shell: bash
      env:
        DEBS: ${{ steps.key.outputs.dir }}
      run: |
        mkdir -p "$DEBS/partial"
        printf 'Dir::Cache::Archives "%s/";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\nDPkg::Lock::Timeout "300";\n' "$DEBS" \
          | sudo tee /etc/apt/apt.conf.d/99-stabileo-browser-debs > /dev/null
    - name: Install browser system dependencies
      shell: bash
      run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps ${{ inputs.browsers }}"
    - name: Prepare downloaded packages for the cache
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEBS: ${{ steps.key.outputs.dir }}
      run: |
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
        ls "$DEBS" | grep -c '\.deb$' || true
    - name: Save downloaded packages
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
