name: "Free disk space"
description: "Remove pre-installed software to free disk space for Nix builds, in the background while the job goes on"

runs:
  using: "composite"
  steps:
    - name: Free up disk space
      shell: bash
      run: |
        sudo nohup rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
          /usr/local/lib/android /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
          /usr/local/.ghcup > /dev/null 2>&1 &
