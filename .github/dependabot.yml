# Dependency update PRs. Security updates arrive regardless of schedule;
# the weekly batches keep version drift (and the advisory backlog) small.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /research/fracture/shauer-2025
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /research/fracture/shauer-2025/wasm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /research/metamaterials/grossman-2026
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /research/metamaterials/grossman-2026/wasm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: mix
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mix-minor:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions current (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
