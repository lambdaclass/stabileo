name: Verification alert

# One `ci-failure` issue per watched workflow (.github/scripts/verification-alert.cjs,
# docs/verification/NIGHTLY.md). workflow_run always runs this file as it is on main: to try a
# branch's version, dispatch it with a run id (dry run by default). It never checks out code
# from the triggering run.

on:
  workflow_run:
    workflows:
      - Nightly verification
      - Verify
      - Differential
      - Mutation testing (TypeScript engine logic)
      - Verification dashboard
      - Supply chain
      - Runner pools
    types: [completed]
  schedule:
    - cron: "0 13 * * *" # staleness check, after every nightly run has finished
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id to alert for (empty: run the staleness check)"
        required: false
        default: ""
      dry_run:
        description: "Only print what would be opened, commented or closed"
        type: boolean
        default: true
      any_event:
        description: "Alert even if that run was not scheduled"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verification-alert-${{ github.event.workflow_run.name || github.event_name }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule' ||
      startsWith(github.event.workflow_run.display_title, '[forced failure]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          ALERT_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_id == '')) && 'stale' || 'run' }}
          ALERT_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ALERT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ALERT_ANY_EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.any_event }}
        with:
          script: |
            const alert = require('./.github/scripts/verification-alert.cjs');
            await alert({ github, context, core });
