name: Verify

# Formal verification: Lean soundness proofs of the result certificate (verify/)
# and Kani harnesses (engine/src/kani_proofs.rs). Property tests and certificate
# tests are ordinary engine tests and run in ci.yml's suite.
#
# Everything runs in the `verify` Nix dev shell so CI and local builds use the
# same tools: `nix develop .#verify -c <cmd>`.
#
# The nightly-only jobs (large certificates, OpenSees / Code_Aster differential,
# fuzzing, mutants) are in nightly.yml, so pull requests do not list them as
# skipped. The schedule here runs the proofs on main every night as well
# (Kani's nightly tier included); a failure alerts (verification-alert.yml).

on:
  # Every pull request and merge-queue entry, so that lean, symbolic and kani
  # can be required checks on main: a required check that never reports blocks
  # the merge. The `changes` job skips them when nothing they check changed (a
  # skipped job counts as passed for branch protection).
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'push-main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  # Pull requests and merge-queue entries only. If this job fails, the proofs run anyway (fail safe).
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      kani: ${{ steps.filter.outputs.kani }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          else
            git fetch -q --depth=1 --no-tags origin "$BASE"
            files=$(git diff --name-only "$BASE" "$HEAD")
          fi
          echo "$files"
          python3 -I .github/scripts/verify-changes.py <<<"$files" | tee -a "$GITHUB_OUTPUT"

  lean:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.verify == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/elan
            verify/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verify/lean-toolchain', 'verify/lake-manifest.json') }}
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop .#verify --command true
      - name: Fetch Mathlib build cache
        working-directory: verify
        run: nix develop ..#verify -c lake exe cache get
      - name: Build proofs
        working-directory: verify
        run: nix develop ..#verify -c lake build
      - name: No sorry, no extra axioms
        working-directory: verify
        run: nix develop ..#verify -c ./scripts/check-axioms.sh
      # The gate itself: an axiom, implemented_by and extern planted in
      # Certify/BundleParse.lean must each be rejected (docs/verification/TRUSTED_BASE.md).
      - name: Axiom gate self-test
        working-directory: verify
        run: nix develop ..#verify -c ./scripts/test-axiom-gate.sh
      # Independent re-check of exported certificate bundles by the verified
      # Lean checker (certcheck); tampered bundles must be rejected.
      - name: Certificate bundles
        working-directory: verify
        run: nix develop ..#verify -c ./scripts/check-bundles.sh

  # The element matrices derived symbolically (tools/symbolic): regenerating
  # engine/tests/symbolic_elements.rs must reproduce the committed file. The
  # generated test itself runs in ci.yml's engine suite.
  symbolic:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.verify == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install SymPy
        run: pip install -r tools/symbolic/requirements.txt
      - name: Generated test is up to date
        run: python -I tools/symbolic/gen.py --check

  kani-shard:
    name: kani-shard (${{ matrix.shard }}/5)
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.kani != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: kani-${{ runner.os }}-${{ hashFiles('flake.lock', 'scripts/kani-setup.sh') }}
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop .#verify --command true
      - name: Install Kani
        run: nix develop .#verify -c ./scripts/kani-setup.sh
      # One harness at a time under a memory/time watchdog: CBMC can need tens of GB
      # per float-heavy harness, and the runner has 16 GB.
      # Pull requests and the merge queue run the fast tier; the nightly schedule and manual runs
      # also run harnesses marked `// kani: nightly`.
      - name: Kani harnesses
        env:
          KANI_MEM_GB: 12
          KANI_SHARD: ${{ matrix.shard }}/5
          # The nightly-tier harnesses take up to ~10 min locally, ~2x that on the runner.
          KANI_TIMEOUT_S: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 900 || 2400 }}
          KANI_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'fast' || 'all' }}
        run: nix develop .#verify -c ./scripts/kani-safe.sh
      - name: Kani report
        if: always()
        run: column -t target/kani-report.tsv || true
      - name: Record shard result
        if: always()
        env:
          SHARD_RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/kani-result"
          printf '%s\n' "$SHARD_RESULT" > "$RUNNER_TEMP/kani-result/result"
      - name: Publish shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kani-result-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/kani-result/result

  kani:
    needs: [changes, kani-shard]
    if: ${{ always() && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.kani != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every Kani shard job succeeded
        env:
          SHARDS_RESULT: ${{ needs.kani-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "Kani shard jobs: $SHARDS_RESULT" >&2
            exit 1
          fi
      - name: Download shard results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kani-result-*
          path: target/kani-results
      - name: Every Kani shard passed
        run: python3 -I .github/scripts/kani-aggregate.py target/kani-results 5
