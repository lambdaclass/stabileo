    uses: lambdaclass/actions/.github/workflows/ai-review-deepseek.yml@d905aa25322fe65abef60e8c8b5cece2cf0f0aad
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  gemini-review:
