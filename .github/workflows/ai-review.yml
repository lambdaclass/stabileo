name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/claude') || startsWith(github.event.comment.body, '/review')))
    uses: lambdaclass/actions/.github/workflows/ai-review-claude.yml@d905aa25322fe65abef60e8c8b5cece2cf0f0aad
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  kimi-review:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/kimi') || startsWith(github.event.comment.body, '/review')))
    uses: lambdaclass/actions/.github/workflows/ai-review-kimi.yml@d905aa25322fe65abef60e8c8b5cece2cf0f0aad
    secrets:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}

  codex-review:
