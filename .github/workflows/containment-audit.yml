name: Safety containment audit (informational)
on:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: List safety issues without a containment decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check-containment.py
