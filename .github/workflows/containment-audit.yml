name: Safety containment audit
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ledger rows kept, and no active row's issue closed by this change
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
        run: python3 -I scripts/check-containment.py --base "$BASE" --event "$GITHUB_EVENT_PATH"
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Open, update or close the report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check-containment.py --live --file-issue
