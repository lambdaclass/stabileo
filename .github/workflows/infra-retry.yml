name: Infrastructure retry

on:
  workflow_run:
    workflows: [CI, Research, Supply chain]
    types: [completed]

permissions: {}

concurrency:
  group: infra-retry-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

jobs:
  retry:
    name: Rerun infrastructure failures once
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/infra-retry.py
          sparse-checkout-cone-mode: false
      - name: Classify the failed jobs and rerun them only on infrastructure evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 -I .github/scripts/infra-retry.py
