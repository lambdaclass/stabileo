name: diag-1667
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    name: diag-1667 (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix]
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - run: .github/scripts/retry-infra.sh nix develop --command true
      - name: WASM from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in $(gh run list --branch main --workflow ci.yml --event push -L 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name wasm --dir web/src/lib/wasm 2>/dev/null; then echo "wasm from $id"; break; fi
          done
          ls web/src/lib/wasm
      - name: App source from main for the baseline
        if: matrix.variant == 'main'
        run: git checkout 477adc7b34ecab88b558b23a6527811f7a0d88f1 -- web/src && git status --short | head
      - run: make web.deps
      - run: make e2e.web.setup
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - run: make e2e.web.build
      - name: Profiled runs
        run: |
          for i in 1 2 3 4; do
            nix develop --command bash -c 'cd web && npx playwright test --retries=0 --grep "@slow the 3-D workspace opens" e2e/rebar-workspace-open.spec.ts' || true
          done
          mkdir -p diag-out && touch diag-out/none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diag-${{ matrix.variant }}
          path: diag-out
          retention-days: 5
