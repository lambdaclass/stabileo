name: Research

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
      - 'engine/**'
      - 'web/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.*'
      - 'rust-toolchain*'
      - 'Makefile'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
      - 'engine/**'
      - 'web/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.*'
      - 'rust-toolchain*'
      - 'Makefile'
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  isolation:
    name: Research isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: research/tools/check_isolation.sh
      - run: python3 -I research/tools/test_check_isolation.py
      - run: python3 -I research/tools/test_asset_identity.py
      - run: python3 -I research/tools/test_docker_context.py
      - name: Research pages draw models only through the shared Stabileo viewer
        run: research/tools/check_viewer.sh
      - name: The viewer rule rejects a page with its own canvas
        run: research/tools/test_check_viewer.sh

  route-size:
    name: Landing and app route byte budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The budget keeps research from growing the product's routes; a change with no research code shipped to the browser is not measured.
      - name: Measure only a change that touches research code
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RESEARCH_PATHS: '^(research/.*\.(json|csv)$|web/src/components/research/|web/public/research-|web/vite\.research-viewer\.config\.ts$)'
          NOT_SHIPPED: '^research/tools/'
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -E "$RESEARCH_PATHS" | grep -qvE "$NOT_SHIPPED"; then
            echo research=true >> "$GITHUB_OUTPUT"
          else
            echo research=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.research == 'true'
        with:
          ref: main
          path: route-main
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Build main and the candidate with the same pinned toolchain and measurement script
        if: steps.scope.outputs.research == 'true'
        run: |
          cp web/scripts/check-research-route-size.mjs web/scripts/research-route-budget.mjs route-main/web/scripts/
          nix develop . -c sh -c 'cd route-main/web && npm ci && node scripts/check-research-route-size.mjs --baseline /tmp/route-main.json --update'
          nix develop . -c sh -c 'cd web && npm ci && node --test scripts/research-route-budget.test.mjs scripts/research-cargo-notices.test.mjs && node scripts/check-research-route-size.mjs --baseline /tmp/route-main.json'
      - run: nix develop . -c node --test research/fracture/shauer-2025/wasm/check.test.mjs

  # Offline: part of the required CI OK (ci.yml calls this workflow), so it never depends on the network.
  catalog:
    name: Research catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned checker dependencies
        run: |
          python3 -m venv /tmp/catalog-venv
          /tmp/catalog-venv/bin/pip install --require-hashes -r research/tools/requirements.txt
      - run: /tmp/catalog-venv/bin/python -I research/tools/test_required_ci.py
      - run: /tmp/catalog-venv/bin/python -I research/tools/test_grossman_catalog.py
      - run: /tmp/catalog-venv/bin/python -I research/tools/test_pastrana_catalog.py
      - run: /tmp/catalog-venv/bin/python -I research/tools/test_fairclough_catalog.py
      - name: Checker rejects bad entries
        run: /tmp/catalog-venv/bin/python -I research/tools/test_catalog.py
      - name: Every entry, evidence file and summary source is well formed
        run: /tmp/catalog-venv/bin/python -I research/tools/catalog.py check --offline

  # Online: Crossref, licences and links. Runs only as the standalone Research workflow (its own
  # pull_request, push and weekly triggers), never inside the required CI OK: an outage at Crossref
  # must not block unrelated merges.
  catalog-online:
    name: Research catalog (Crossref, licenses)
    if: github.workflow == 'Research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned checker dependencies
        run: |
          python3 -m venv /tmp/catalog-venv
          /tmp/catalog-venv/bin/pip install --require-hashes -r research/tools/requirements.txt
      - name: Checker rejects bad entries
        run: /tmp/catalog-venv/bin/python -I research/tools/test_catalog.py --online
      - name: Every DOI, title, author list, year, venue and code license matches its source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/catalog-venv/bin/python -I research/tools/catalog.py check --links

  phasefield:
    name: Phase-field (Shauer 2025) validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/fracture/shauer-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests, including the validation against the reference outputs
        run: cargo test --release --locked -- --nocapture
      - name: Browser configuration limits reject oversized meshes before allocation
        run: cargo test --locked --manifest-path wasm/Cargo.toml
      - name: Reference outputs match their manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          m = json.load(open("reference-results/MANIFEST.json"))
          for name, digest in m["files_sha256"].items():
              assert hashlib.sha256(open(os.path.join("reference-results", name), "rb").read()).hexdigest() == digest, name
          extra = set(os.listdir("reference-results")) - set(m["files_sha256"]) - {"MANIFEST.json"}
          assert not extra, extra
          print(len(m["files_sha256"]), "reference files match MANIFEST.json")
          PY

  topopt:
    name: Topology optimization (Andreassen 2011)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - run: nix develop -c cargo test --release --locked --manifest-path research/optimization/andreassen-2011/Cargo.toml
      - run: nix develop -c cargo test --release --locked --manifest-path research/optimization/andreassen-2011/wasm/Cargo.toml
      - run: nix develop -c node --test research/optimization/andreassen-2011/wasm/check.test.mjs
      - run: nix develop -c research/optimization/andreassen-2011/wasm/build.sh
      - run: nix develop -c make wasm
      - run: nix develop -c sh -c 'cd web && npm ci && npx vitest run src/components/research/andreassen2011/model.test.ts'
  engine-benchmarks:
    name: Production engine benchmarks (native and WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39
      - run: nix develop -c sh -c 'cd web && npm ci'
      - run: make wasm
      - name: Compute native results from the engine-owned cases
        run: MACNEAL_HARDER_RESULTS=/tmp/macneal-native.json nix develop -c cargo test --locked --manifest-path engine/Cargo.toml --test shells macneal_harder::browser_cases
      - name: Compare the page runner through the production WASM wrapper
        run: nix develop -c node research/benchmarks/macneal-harder-1985/wasm/check.mjs /tmp/macneal-native.json
      - name: Test measurement and editor handoff
        run: nix develop -c sh -c 'cd web && npx vitest run src/components/research/macneal1985/__tests__/cases.test.ts'
      - name: Mattiasson native regression assertions
        run: nix develop -c cargo test --locked --release --manifest-path engine/Cargo.toml --test validation corotational_benchmarks
      - name: Mattiasson fresh production native results
        run: nix develop -c cargo run --locked --release --manifest-path research/benchmarks/mattiasson-elastica/Cargo.toml -- /tmp/mattiasson-native.json
      - name: Mattiasson production WASM parity and measurements
        run: |
          nix develop -c node research/benchmarks/mattiasson-elastica/wasm/check.mjs /tmp/mattiasson-native.json
          nix develop -c sh -c 'cd web && npx vitest run src/components/research/mattiasson1981/__tests__/cases.test.ts'

      - name: Compute shell obstacle course native results without changing regression bounds
        run: |
          SHELL_OBSTACLE_RESULTS=/tmp/shell-native nix develop -c cargo test --locked --release --manifest-path engine/Cargo.toml --test validation benchmark_scordelis_lo
          SHELL_OBSTACLE_RESULTS=/tmp/shell-native nix develop -c cargo test --locked --release --manifest-path engine/Cargo.toml --test validation benchmark_pinched_cylinder
          SHELL_OBSTACLE_RESULTS=/tmp/shell-native nix develop -c cargo test --locked --release --manifest-path engine/Cargo.toml --test validation benchmark_hemisphere_hole_convergence
      - name: Compare shell obstacle course native and production WASM results
        run: nix develop -c node research/benchmarks/shell-obstacle-course/wasm/check.mjs /tmp/shell-native
      - name: Test shell measurement, projection and editor handoff
        run: nix develop -c sh -c 'cd web && npx vitest run src/components/research/shell1985/__tests__/cases.test.ts'

  springs:
    name: Spring networks (Grossman 2026) validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/metamaterials/grossman-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests, including the checks against the paper's published values
        run: cargo test --release --locked -- --nocapture
      - name: The committed comparison series are what the code computes
        run: |
          cargo run --release --locked --bin reproduce -- /tmp/stabileo_results.json
          # Same numbers up to the last bits that the platform's libm (sin, cos, hypot) may change.
          python3 - <<'PY'
          import json
          def walk(a, b, path="$"):
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: walk(a[k], b[k], f"{path}.{k}")
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): walk(x, y, f"{path}[{i}]")
              elif isinstance(a, float) or isinstance(b, float):
                  assert abs(a - b) <= 1e-8 * max(1.0, abs(a), abs(b)), (path, a, b)
              else:
                  assert a == b, (path, a, b)
          walk(json.load(open("/tmp/stabileo_results.json")), json.load(open("results/stabileo_results.json")))
          print("results/stabileo_results.json is current")
          PY
      - name: Reference values match their manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          m = json.load(open("reference-results/MANIFEST.json"))
          for name, digest in m["files_sha256"].items():
              assert hashlib.sha256(open(os.path.join("reference-results", name), "rb").read()).hexdigest() == digest, name
          extra = set(os.listdir("reference-results")) - set(m["files_sha256"]) - {"MANIFEST.json"}
          assert not extra, extra
          print(len(m["files_sha256"]), "reference files match MANIFEST.json")
          PY

  koiter:
    name: Roorda frame (Ferrari and Sigmund 2025) groundwork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/stability/ferrari-sigmund-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Buckling, energy derivatives and every replay frame
        run: cargo test --release --locked -- --nocapture
  form-finding:
    name: Four-cable FDM (Pastrana 2026) validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked --manifest-path research/form-finding/pastrana-2026/Cargo.toml
      - run: cargo test --locked --manifest-path research/form-finding/pastrana-2026/wasm/Cargo.toml
  arches:
    name: Curvature-patterned arches validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked --manifest-path research/mechanics/biggins-2026/Cargo.toml
      - run: cargo run --locked --manifest-path research/mechanics/biggins-2026/Cargo.toml --bin validate
  fairclough:
    name: Five-node gridshell (Fairclough 2026) validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - run: nix develop -c cargo test --locked --manifest-path research/optimisation/fairclough-2026/Cargo.toml
  riks-crisfield:
    name: Arc-length (Riks–Crisfield) native and WASM validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Native production results reproduce the committed evidence, including known failures
        run: nix develop . -c cargo run --release --locked --manifest-path research/numerical-methods/riks-crisfield/native/Cargo.toml -- check
      - name: Build the production browser engine
        run: nix develop . -c make wasm
      - name: Browser WASM matches native path steps and displacements
        run: nix develop . -c node research/numerical-methods/riks-crisfield/wasm/check.mjs web/src/lib/wasm research/numerical-methods/riks-crisfield/reference-results/arc_length_snap_through.json research/numerical-methods/riks-crisfield/reference-results/native-results.json
