name: Mutation testing (TypeScript engine logic)

# Stryker over the safety-relevant TypeScript in web/src/lib/engine (web/stryker.config.json
# lists the modules). Nightly, because a full run takes far longer than a PR should wait; on
# demand from the Actions tab. The HTML report is uploaded; surviving mutants in the critical
# modules are listed in docs/verification/TS_ENGINE_LOGIC.md.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: bash .github/scripts/install-wasm-pack.sh
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-node@v7
        with:
          # Stryker 10 requires Node 22+ (the rest of CI stays on 20, the unit environment).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM engine
        working-directory: engine
        run: wasm-pack build --target web --out-dir ../web/src/lib/wasm --no-opt

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Stryker
        working-directory: web
        run: npm run test:mutation

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: web/reports/mutation/
          retention-days: 30
