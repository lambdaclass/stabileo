name: Nightly verification

# The verification that is too slow for a pull request: large certificates,
# exhaustive metamorphic tests, differential tests against OpenSees and Code_Aster, fuzzing, mutation
# testing of the safety-critical Rust and the criterion benchmarks. Nightly
# on main and on demand (Actions tab, or `gh workflow run nightly.yml`, with
# `only` to pick jobs). A failed scheduled run opens or updates a
# `verification-failure` issue (verification-alert.yml).
#
# Runner routing, capacity budgets and staged rollout: docs/verification/NIGHTLY.md.
#
# The proofs (Lean, Kani, symbolic) run in verify.yml, the other differential
# programs (Frame3DD, PyNite, Mystran, Kratos, CalculiX) in differential.yml,
# TypeScript mutation testing in mutation-ts.yml.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Jobs to run, space separated (default all): certify-large metamorphic-nightly opensees-diff codeaster-diff fuzz random-models properties mutants bench"
        required: false
        default: ""
      random_count:
        description: "Valid random models (blank: 1000 self-hosted / 100 hosted)"
        required: false
        default: ""
      seed:
        description: "Random-model seed (blank: UTC YYYYMMDD)"
        required: false
        default: ""
      findings_dry_run:
        description: "Print findings without creating issues"
        type: boolean
        default: true
      mutants_shards:
        description: "Mutants: JSON list of shard indices to run instead of tonight's rotation, e.g. [5] or [0,1]"
        required: false
        default: ""
      mutants_total:
        description: "Mutants: total number of shards (default 512)"
        required: false
        default: ""

concurrency:
  group: nightly-bug-farm
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  # Which jobs run, and which mutants shards tonight. The mutants scope
  # (scripts/mutants.sh: certificate code, linear solver core, element
  # kernels) has ~23,000 mutants at 20 s to 2 min each: one pass is far more than a
  # night of runners, so it is split into MUTANTS_TOTAL shards and
  # MUTANTS_SLOTS of them run each night, rotating with the day number. Every
  # mutant is tested once every MUTANTS_TOTAL / MUTANTS_SLOTS nights.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      mutants_shards: ${{ steps.plan.outputs.mutants_shards }}
      mutants_total: ${{ steps.plan.outputs.mutants_total }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SHARDS: ${{ inputs.mutants_shards }}
          TOTAL: ${{ inputs.mutants_total }}
          MUTANTS_TOTAL: 512
          MUTANTS_SLOTS: 4
        run: |
          all="certify-large metamorphic-nightly opensees-diff codeaster-diff fuzz random-models properties mutants bench"
          only="${ONLY:-$all}"
          for j in $only; do
            case " $all " in *" $j "*) ;; *) echo "::error::unknown job '$j' (known: $all)"; exit 1 ;; esac
          done
          total="${TOTAL:-$MUTANTS_TOTAL}"
          if [ -n "$SHARDS" ]; then
            shards="$SHARDS"
          else
            day=$(( $(date -u +%s) / 86400 ))
            shards=$(python3 -c "import json,sys; t,s,d=map(int,sys.argv[1:]); print(json.dumps([(d*s+i)%t for i in range(s)]))" \
              "$total" "$MUTANTS_SLOTS" "$day")
          fi
          echo "jobs: $only"
          echo "mutants shards (of $total): $shards"
          {
            echo "jobs= $only "
            echo "mutants_shards=$shards"
            echo "mutants_total=$total"
          } >> "$GITHUB_OUTPUT"

  # Large-model certificate runs (release, #[ignore]d in the normal suite):
  # certifies the 3D fixtures above 400 DOFs and grid frames up to 15k DOFs,
  # and runs the large sweep of the cross-path assembly oracle
  # (docs/verification/ASSEMBLY.md).
  certify-large:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' certify-large ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rust-src
      # engine/.cargo/config.toml links with clang + mold.
      # A pinned mold release tarball (wget with retries). apt used to install it here and could
      # stall for an hour on a mirror; the version is the flake's (scripts/check-pins.sh).
      - name: Install mold linker
        if: runner.environment == 'github-hosted'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # main, 2026-10-08
        with:
          mold-version: 2.40.4
          make-default: false
        timeout-minutes: 5
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Large certificate tests
        working-directory: engine
        # The assembly oracle's other ignored tests are minimal reproductions
        # of open bugs, so only its sweep runs here.
        run: |
          cargo test --release --test certificates -- --ignored --nocapture certify:: certify_plastic_3d::
          cargo test --release --test solver assembly_paths::assembly_paths_agree_large -- --ignored --nocapture

  # Metamorphic tests, exhaustive tier (docs/verification/METAMORPHIC.md):
  # the whole corpus and up to 2,000 random models through every analysis, checking
  # rotation / mirror / renumbering / unit-scaling invariance, superposition,
  # reciprocity, energy and symmetry. Pull requests run the sampled tier in
  # ci.yml's suite (metamorphic_pr_*). The seed moves daily and is printed.
  metamorphic-nightly:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' metamorphic-nightly ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset run-local reports
        run: rm -rf metamorphic-report nightly-findings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      # A pinned mold release tarball (wget with retries). apt used to install it here and could
      # stall for an hour on a mirror; the version is the flake's (scripts/check-pins.sh).
      - name: Install mold linker
        if: runner.environment == 'github-hosted'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # main, 2026-10-08
        with:
          mold-version: 2.40.4
          make-default: false
        timeout-minutes: 5
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Differential corpus is current
        run: python3 -I tools/differential/export_corpus.py --check
      - name: Metamorphic (exhaustive)
        working-directory: engine
        env:
          METAMORPHIC_CASES: ${{ runner.environment == 'self-hosted' && '1000' || '200' }}
          METAMORPHIC_REPORT_DIR: ${{ github.workspace }}/metamorphic-report
        run: |
          export METAMORPHIC_SEED=$(( $(date -u +%s) / 86400 ))
          echo "METAMORPHIC_SEED=$METAMORPHIC_SEED" >> "$GITHUB_ENV"
          mkdir -p "$METAMORPHIC_REPORT_DIR"
          echo "$METAMORPHIC_SEED" | tee "$METAMORPHIC_REPORT_DIR/seed.txt"
          cargo test --locked --release --test metamorphic --no-run --message-format=json > "$RUNNER_TEMP/nightly-build.jsonl"
          python3 -c 'import json,os; rows=[json.loads(l) for l in open(os.environ["RUNNER_TEMP"]+"/nightly-build.jsonl")]; exe=next(r["executable"] for r in rows if r.get("executable") and r.get("target",{}).get("name")=="metamorphic"); print("NIGHTLY_REPLAY_BIN="+exe)' >> "$GITHUB_ENV"
          cargo build --locked --release --example solve_json
          timeout --signal=TERM --kill-after=30s 110m cargo test --locked --release --test metamorphic metamorphic_nightly_ -- --ignored --nocapture --test-threads 2
      - name: Reduce and package metamorphic findings
        if: failure()
        timeout-minutes: 15
        run: python3 scripts/nightly-collect.py --models metamorphic-report/models --check metamorphic --seed "$METAMORPHIC_SEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-metamorphic
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metamorphic-report
          path: metamorphic-report/
          if-no-files-found: ignore

  # Differential test against OpenSees (an independent FE code): catches
  # element-matrix, fixed-end-force, axis-convention and reaction bugs that the
  # certificates cannot (they certify the assembled system, right or wrong).
  # Linear static, buckling, modal, P-Delta, time history, plates and shells
  # (~10 min on 4 cores; tools/opensees/README.md).
  # Fixed fixture set plus random models from a seed that moves daily; the
  # seed is printed so a failure reproduces with tools/opensees/run.sh.
  opensees-diff:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' opensees-diff ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset run-local reports
        run: rm -rf opensees-mismatches nightly-findings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install OpenSees
        run: |
          python3 -m venv "$RUNNER_TEMP/nightly-opensees"
          "$RUNNER_TEMP/nightly-opensees/bin/pip" install openseespy numpy
          echo "$RUNNER_TEMP/nightly-opensees/bin" >> "$GITHUB_PATH"
      - name: Build solver CLI
        run: cargo build --release --example solve_json
      - name: Compare with OpenSees
        run: |
          seed=$(( $(date -u +%s) / 86400 % 1000 * 1000 ))
          echo "seed-start $seed"
          echo "DIFF_SEED=$seed" >> "$GITHUB_ENV"
          python tools/opensees/compare.py --fixtures \
            --random2d 300 --random3d 300 --rich2d 500 --rich3d 500 \
            --buckling2d 300 --buckling3d 300 --modal2d 300 --modal3d 300 \
            --pdelta2d 300 --pdelta3d 300 --th2d 200 --th3d 200 \
            --plates 300 --shells 60 \
            --bin "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/release/examples/solve_json" \
            --seed-start "$seed" -j 2 --report opensees-report.json \
            --dump-dir opensees-mismatches
      - name: Reduce and package opensees findings
        if: failure()
        timeout-minutes: 15
        run: python3 scripts/nightly-collect.py --models opensees-mismatches --check opensees --seed "$DIFF_SEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-opensees
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: opensees-report
          path: |
            opensees-report.json
            opensees-mismatches/
          if-no-files-found: ignore

  # Differential test against Code_Aster 18.1 (EDF's FE code): the 3D linear
  # solver including releases, connectors, constraints, thermal loads and
  # inclined supports, which the OpenSees job does not translate. conda-forge
  # code-aster, native on Linux. See tools/differential/codeaster/README.md;
  # the seed is printed so a failure reproduces locally.
  codeaster-diff:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' codeaster-diff ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset run-local reports
        run: rm -rf tools/differential/codeaster/codeaster-mismatches nightly-findings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Code_Aster (pins as in tools/differential/codeaster/setup.sh)
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: aster
          create-args: -c conda-forge code-aster=18.1.10 python=3.12
          cache-environment: true
          init-shell: bash
      - name: Build solver CLI
        run: cargo build --release --example solve_json
      - name: Translator unit tests
        run: python tools/differential/codeaster/test_to_aster.py
      - name: Compare with Code_Aster
        working-directory: tools/differential/codeaster
        run: |
          seed=$(( $(date -u +%s) / 86400 % 1000 * 1000 ))
          echo "seed-start $seed"
          echo "DIFF_SEED=$seed" >> "$GITHUB_ENV"
          ASTER_PYTHON="$(which python)" python run.py --fixtures \
            --random3d 100 --rich3d 400 --aster3d 400 \
            --bin "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/release/examples/solve_json" \
            --seed-start "$seed" -j 2 --report codeaster-report.json \
            --dump-dir codeaster-mismatches
      - name: Reduce and package codeaster findings
        if: failure()
        timeout-minutes: 15
        run: ASTER_PYTHON="$(which python)" python3 scripts/nightly-collect.py --models tools/differential/codeaster/codeaster-mismatches --check codeaster --seed "$DIFF_SEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-codeaster
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeaster-report
          path: |
            tools/differential/codeaster/codeaster-report.json
            tools/differential/codeaster/codeaster-mismatches/
          if-no-files-found: ignore

  # Coverage-guided fuzzing of the JSON entry points the WASM layer exposes
  # (engine/fuzz, docs/verification/FUZZ_MUTANTS.md): no panic, no runaway
  # work, finite results, consistent certificates. One target per runner,
  # seeded from the template fixtures; crashing inputs are uploaded.
  fuzz:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' fuzz ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [json_static, json_dynamics, json_plastic, model_certify]
    env:
      # cargo-fuzz defaults to the triple it was itself built for, and the
      # prebuilt cargo-fuzz is a musl binary: the sanitizer build then fails
      # ("sanitizer is incompatible with statically linked libc").
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-15
          components: rust-src
      # engine/.cargo/config.toml links with clang + mold.
      # A pinned mold release tarball (wget with retries). apt used to install it here and could
      # stall for an hour on a mirror; the version is the flake's (scripts/check-pins.sh).
      - name: Install mold linker
        if: runner.environment == 'github-hosted'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # main, 2026-10-08
        with:
          mold-version: 2.40.4
          make-default: false
        timeout-minutes: 5
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            engine/fuzz -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Reset run-local reports and record seed
        run: |
          rm -rf engine/fuzz/artifacts/${{ matrix.target }} nightly-findings
          mkdir -p nightly-findings
          seed=$(( $(date -u +%s) / 86400 ))
          echo "FUZZ_SEED=$seed" >> "$GITHUB_ENV"
          echo "$seed" | tee nightly-findings/seed.txt
      - name: Seed corpus
        working-directory: engine
        run: cargo run --release --example fuzz_seeds
      - name: Build target
        working-directory: engine
        run: cargo +nightly-2026-10-15 fuzz build --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }}
      - name: Fuzz (2 hours on own runners, 30 minutes on fallback)
        id: fuzz
        env:
          FUZZ_SECONDS: ${{ runner.environment == 'self-hosted' && '7200' || '1800' }}
        working-directory: engine
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly-2026-10-15 fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} -- \
            -seed="$FUZZ_SEED" -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=60 \
            -print_final_stats=1
      - name: Retain original fuzz crashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: engine/fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90
          if-no-files-found: ignore
      - name: Package individual crash findings
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: python3 scripts/nightly-fuzz-findings.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-${{ matrix.target }}
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: error

  # Mutation testing (cargo-mutants, config .cargo/mutants.toml): every mutant
  # of the certificate code, the linear solver core and the element kernels
  # must be caught by the tests, or excluded in the config as equivalent with a
  # justification. Tonight's shards come from the plan job's rotation. Each
  # shard fails on a missed mutant, and fails loudly (with how far it got) if
  # it does not finish within its time budget; the report is uploaded either way.
  mutants:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' mutants ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.mutants_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stable is enough: cargo-mutants builds from the workspace root, where
      # engine/.cargo/config.toml (build-std, nightly-only) does not apply.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      # A pinned mold release tarball (wget with retries). apt used to install it here and could
      # stall for an hour on a mirror; the version is the flake's (scripts/check-pins.sh).
      - name: Install mold linker
        if: runner.environment == 'github-hosted'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # main, 2026-10-08
        with:
          mold-version: 2.40.4
          make-default: false
        timeout-minutes: 5
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants,nextest
      - name: Mutants (shard ${{ matrix.shard }}/${{ needs.plan.outputs.mutants_total }})
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.mutants_total }}
          # Leaves time to upload the report before the job timeout.
          BUDGET_MIN: 120
        run: |
          # Each mutant is a rebuild of the engine and its test binaries: keep
          # it incremental (rust-cache turns incremental off), without debug
          # info, and linked by mold; nextest runs the test binaries in
          # parallel rather than one after the other. cargo-mutants builds from the workspace
          # root, where engine/.cargo/config.toml does not apply.
          export CARGO_INCREMENTAL=1 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=mold"
          status=0
          timeout --signal=INT --kill-after=5m "${BUDGET_MIN}m" \
            ./scripts/mutants.sh --shard "$SHARD" --jobs 2 --test-tool nextest || status=$?
          python3 scripts/mutants-summary.py mutants.out "$SHARD" || true
          if [ "$status" -eq 124 ]; then
            echo "::error::mutants shard $SHARD did not finish within ${BUDGET_MIN} min (see the summary above for how far it got); raise MUTANTS_TOTAL in nightly.yml"
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-report-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  # Criterion reports, informational: benchmark wall time on shared runners is
  # too noisy to gate on (the perf regression gates in ci.yml run
  # single-threaded for that reason). The reports are uploaded for comparison.
  bench:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' bench ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rust-src
      # A pinned mold release tarball (wget with retries). apt used to install it here and could
      # stall for an hour on a mirror; the version is the flake's (scripts/check-pins.sh).
      - name: Install mold linker
        if: runner.environment == 'github-hosted'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # main, 2026-10-08
        with:
          mold-version: 2.40.4
          make-default: false
        timeout-minutes: 5
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Benchmarks compile
        working-directory: engine
        run: cargo bench --no-run
      - name: Run criterion benchmarks (quick)
        working-directory: engine
        run: cargo bench --bench solver_bench --bench assembly_bench --bench workflow_bench -- --sample-size 10 --warm-up-time 1 --measurement-time 3
        # Informational, as it was in ci.yml: the dense-LU 15x15 quad9 case
        # alone needs ~5 min for 10 samples on the runner, and a slow runner
        # is not a correctness failure. Whatever finished is uploaded below;
        # a failure to compile still fails the step above.
        timeout-minutes: 25
        continue-on-error: true
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-reports
          path: ${{ env.CARGO_TARGET_DIR || format('{0}/target', github.workspace) }}/criterion
          retention-days: 30
          if-no-files-found: warn

  random-models:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' random-models ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset run-local reports
        run: rm -rf nightly-findings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Build generator and invariance replay
        run: |
          mkdir -p nightly-findings
          cargo build --release --example solve_json
          cargo test --release --test metamorphic --no-run --message-format=json > "$RUNNER_TEMP/nightly-build.jsonl"
          python3 -c 'import json,os; rows=[json.loads(l) for l in open(os.environ["RUNNER_TEMP"]+"/nightly-build.jsonl")]; exe=next(r["executable"] for r in rows if r.get("executable") and r.get("target",{}).get("name")=="metamorphic"); print("NIGHTLY_REPLAY_BIN="+exe)' >> "$GITHUB_ENV"
      - name: Random valid models, invariance and installed references
        env:
          COUNT: ${{ inputs.random_count || (runner.environment == 'self-hosted' && '1000' || '100') }}
          SEED: ${{ inputs.seed }}
          SECONDS_BUDGET: ${{ runner.environment == 'self-hosted' && '7200' || '1800' }}
        run: |
          seed="${SEED:-$(date -u +%Y%m%d)}"
          timeout --signal=TERM --kill-after=30s "$((SECONDS_BUDGET + 300))s" \
            python3 scripts/nightly-models.py --count "$COUNT" --seed "$seed" --seconds "$SECONDS_BUDGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-random-models
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: error

  properties:
    needs: plan
    if: contains(needs.plan.outputs.jobs, ' properties ')
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset run-local reports
        run: rm -rf property-report nightly-findings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Property soak (two hours, 30 minutes on fallback)
        shell: bash
        env:
          NIGHTLY_FINDINGS_DIR: ${{ github.workspace }}/nightly-findings
          PROPTEST_CASES: ${{ runner.environment == 'self-hosted' && '10000' || '1000' }}
          BUDGET: ${{ runner.environment == 'self-hosted' && '7200' || '1800' }}
        run: |
          mkdir -p property-report
          seed=$(date -u +%Y%m%d)
          echo "$seed" | tee property-report/seed.txt
          export PROPTEST_RNG_SEED="$seed"
          timeout --signal=TERM --kill-after=30s "$BUDGET" \
            cargo test --release --test certificates properties_ -- --nocapture --test-threads 2 \
            2>&1 | tee property-report/output.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: property-report
          path: property-report/
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-findings-properties
          path: nightly-findings/
          retention-days: 90
          if-no-files-found: ignore

  findings:
    needs: [fuzz, random-models, properties, metamorphic-nightly, opensees-diff, codeaster-diff]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: nightly-findings-*
          path: nightly-findings
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          FINDINGS_DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.findings_dry_run) }}
        with:
          script: |
            await require('./.github/scripts/nightly-findings.cjs')({ github, context, core });
