name: Issue reproducers

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-reproducers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flip:
    name: Wrong-result reproducers flipped
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fixes #N flips #N's expected-failure reproducers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          make check.issue-reproducers BASE="$base" HEAD="$HEAD_SHA" BODY="$RUNNER_TEMP/body.md"
