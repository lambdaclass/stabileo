# Infrastructure: self-hosted runners use installed Nix/local store; hosted installer/cache
# failures are advisory (use-flakehub: false). Nix acquisition must still succeed.
# retry-infra.sh retries dependency downloads twice only for known infra log patterns;
# builds/tests/timeouts are never retried. Optional Actions caches may fail open.
# Top-level full PR build audit, excluding builds spawned by tests:
# engine WASM 2; research WASM sets 2 (1 on source-cache hit); site builds
# 6: production, E2E, admin, Docker source, and route-budget main/candidate.
# Docker tests both source and site-production paths; E2E shards share site-e2e.
# Research cache excludes viewer: always rebuild viewer and republish asset identity.
# Keep Research WASM at 30 min: recent hosted success 22m26s, compilation 17m17s.
# PR selection (docs/changelog may accompany any single area):
# docs/**, root *.md, changelog.d/**: repository lint/changelog only.
# research/**, web/src/components/research/**, web/e2e/research*.spec.ts:
# research validation/WASM, research unit + E2E, route budgets, shared WASM/site.
# web/src/components/tools/** (+ tools*.spec.ts): tools unit + E2E, route budgets;
# missing area tests conservatively select full CI.
# engine/**: engine/AI-backend/research suites, determinism/results, full web unit, @engine smoke.
# Every web selection includes Web Build and its TypeScript/Svelte gates.
# Other/mixed/unknown paths and run-e2e label: full pipeline.
# ONLY pull_request job selection is narrowed. Trusted events select all jobs;
# research route isolation still selects research changes within its job.
# CI OK accepts intentional skips but rejects failures/cancellations, including detection.
name: CI

on:
  push:
    branches: [main]
  # Every base branch: PRs stacked on another PR get CI too.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The merge queue: each PR is tested on top of the ones merging before it, so two PRs that
  # are green on their own cannot break main together.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR makes its older run moot; every run on main is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test

# Every job installs the toolchain from flake.nix and runs a make target, so a
# job that passes here passes on a developer's machine with the same command.
#
# Self-hosted runners (six on Stabileo's stabileo-ci-1, an AX102 running Arch Linux;
# dotfiles servers/runners-stabileo.sh, labels `self-hosted`, `stabileo`): Lint Repo,
# Lint Engine, both Engine Suite shards, Engine Metamorphic, WASM, Research WASM and Results Snapshot
# run there when STABILEO_SELF_HOSTED is 'true', only for merge_group and pushes to main.
# Every pull_request, including fork PRs, stays on GitHub; forks cannot trigger merge_group.
# Each runner keeps its own CARGO_TARGET_DIR; checkout explicitly cleans each job's workspace.
# Nix is already installed on the host. Tools come from the flake; self-hosted jobs skip the
# installer, rust-cache, magic-nix-cache (runner users are not trusted Nix users) and free-disk.
# Engine Gates and both Web Unit shards stay on GitHub: their timing budgets have failed
# beside other busy jobs on the shared host. Research validation and route budgets stay there too.
# Web Build, E2E Site, all ten E2E shards and e2e-flaky use the same trusted
# event/variable gate below. Their Linux e2e shell supplies pinned Rust and Playwright
# browsers, libraries and fallback fonts; no browser downloads, apt or sudo on the Arch host.
# Chromium and Firefox passed the Linux host preflight; Nix WebKit did not start.
# Determinism stays on GitHub to check Chromium, Firefox and WebKit.
# Run scripts/ci/check-playwright-nix.sh on the host before enabling the variable.
# Docker build smoke stays on GitHub because Docker is not guaranteed on stabileo-ci-1.
# Other jobs remain on GitHub. Unset or 'false', the variable sends every job to GitHub.
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.select.outputs.engine }}
      web: ${{ steps.select.outputs.web }}
      research: ${{ steps.select.outputs.research }}
      docker: ${{ steps.select.outputs.docker }}
      backend: ${{ steps.select.outputs.backend }}
      ai_backend: ${{ steps.select.outputs.ai_backend }}
      ci_scripts: ${{ steps.select.outputs.ci_scripts }}
      scope: ${{ steps.select.outputs.scope }}
      unit_area: ${{ steps.select.outputs.unit_area }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
      e2e_shards: ${{ steps.select.outputs.e2e_shards }}
      e2e_total: ${{ steps.select.outputs.e2e_total }}
      web_build: ${{ steps.select.outputs.web_build }}
      flaky: ${{ steps.select.outputs.flaky }}
      determinism: ${{ steps.select.outputs.determinism }}
      results: ${{ steps.select.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          list-files: json
          filters: |
            all:
              - '**'
            tooling: &tooling
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - '.nvmrc'
              - 'scripts/wasm-cached.sh'
              - 'scripts/ci/check-playwright-nix.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            engine:
              - *tooling
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/**'
            docker:
              - *tooling
              - 'Dockerfile'
              - '.dockerignore'
              - 'web/**'
              - 'research/**'
              - 'engine/**'
              - 'ai-backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'Dockerfile'
              - '.dockerignore'
              - *tooling
              - 'web/**'
              # The /research pages import the catalog and reference results and ship its WASM.
              - 'research/**'
              - 'engine/**'
              # The engine's dependencies (wasm-bindgen, serde) are locked here.
              - 'Cargo.toml'
              - 'Cargo.lock'
            research:
              - *tooling
              - 'research/**'
              - 'web/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/research.yml'
            backend:
              - *tooling
              - 'backend/**'
            ai_backend:
              - *tooling
              - 'ai-backend/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ci_scripts:
              - '.github/workflows/research.yml'
              - 'scripts/tests/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
      - name: Select PR jobs (all jobs for trusted events)
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
        run: python3 .github/scripts/select-ci.py

  docker-smoke:
    name: Docker build smoke
    needs: [changes, web-build]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested production site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh gh run download "$RUN_ID" --name site-production --dir ci-site
      # Also exercise Compose's default frontend/WASM compiler stages.
      - run: docker build --tag stabileo-source-smoke .
      - run: docker build --build-arg FRONTEND_STAGE=web-prebuilt --tag stabileo-smoke .

  # One version of each tool everywhere (rust-toolchain.toml, .nvmrc, flake.nix and the
  # workflows), and changelog.d/ fragments well formed. On every run: neither has a path filter.
  lint-repo:
    name: Lint Repo
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Toolchain pins agree
        run: nix develop --command make check-pins NIX_RUN=
      - name: Changelog fragments are well formed
        run: nix develop --command make check.changelog NIX_RUN=
      # The engine's test files are modules of a few listed binaries (autotests = false): a file
      # in no binary would never run, one in two would run twice.
      - name: Every engine test file is in exactly one test binary
        run: nix develop --command make check.test-targets NIX_RUN=

  test-ci-scripts:
    name: Test CI Scripts
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ci_scripts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Shellcheck
        run: make test.ci-scripts

  lint-engine:
    name: Lint Engine
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-lint
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Clippy
        run: make lint.engine

  # Named correctness gates. Every gate's tests are EXCLUDED from the suite
  # job below — each test must run exactly once per CI run. The make targets
  # (test.engine.gates / test.engine.suite) keep the two in step.
  #
  # GitHub's runners even when STABILEO_SELF_HOSTED is on: its perf gates time the solver, and
  # next to five busy jobs on stabileo-ci-1 they ran over budget (scale_3d_assembly_sub_cubic).
  test-engine-gates:
    name: Engine Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-test
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Named correctness gates
        run: make test.engine.gates

  test-engine-suite:
    name: Engine Suite (${{ matrix.shard }}/2)
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-test
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Test suite
        run: make test.engine.suite SHARD=${{ matrix.shard }}/2
        timeout-minutes: 25

  # Metamorphic tests, sampled tier (docs/verification/METAMORPHIC.md), in release:
  # unoptimised they outlast a suite shard.
  test-engine-metamorphic:
    name: Engine Metamorphic
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-metamorphic-release
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Metamorphic tests (sampled tier, release)
        run: make test.engine.metamorphic
        timeout-minutes: 30

  test-ai-backend:
    name: Test AI Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.ai_backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: ai-backend
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Tests
        run: make test.ai-backend

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Install dependencies
        run: make deps
      - name: Lint
        run: make lint.backend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Start PostgreSQL and set up the database
        run: make setup
      - name: Run tests
        run: make test.backend

  check-migrations-immutable:
    name: Check Migrations Immutable
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for modified migration files
        run: ./.github/scripts/check-migrations-immutable.sh "origin/${{ github.base_ref }}"

  check-migrations:
    name: Check Migration Safety
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List new migrations
        id: new
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          ./.github/scripts/new-migrations.sh "$BASE" > "$RUNNER_TEMP/new-migrations.txt"
          cat "$RUNNER_TEMP/new-migrations.txt"
          if [ -s "$RUNNER_TEMP/new-migrations.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations to check."
          fi
      - if: runner.environment == 'github-hosted' && (steps.new.outputs.any == 'true')
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted' && steps.new.outputs.any == 'true'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && (steps.new.outputs.any == 'true')
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
        if: steps.new.outputs.any == 'true'
      - name: Cache deps
        if: steps.new.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Install dependencies
        if: steps.new.outputs.any == 'true'
        run: make deps
      - name: Check new migrations for production safety
        if: steps.new.outputs.any == 'true'
        run: |
          while IFS= read -r file; do
            make migrations.check.file FILE="$file"
          done < "$RUNNER_TEMP/new-migrations.txt"

  # The WASM engine, built once per run and shared by every web job (they used to build it nine
  # times: web-unit ×2, web-build, determinism, e2e ×5; with ten e2e shards it would be fourteen). The glue is gitignored, so without it
  # Vite would substitute a stub solver; the e2e readiness gate fails loudly if that happens.
  wasm:
    name: WASM
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: wasm
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Build WASM engine
        run: make wasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: web/src/lib/wasm
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The Stabileo Research page's WASM (research/fracture/shauer-2025/wasm), separate from the
  # engine's and served only to /research pages. The e2e site carries it so the research smoke
  # test runs the real simulation.
  research-wasm:
    name: Research WASM
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      # Cache only the expensive Rust bundles/replay. Rebuild and republish the viewer below.
      - name: Research compiled assets
        id: research-assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            web/public/research-wasm/shauer-2025
            web/public/research-wasm/grossman-2026
          key: research-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'engine/src/**', 'engine/Cargo.toml', 'engine/build.rs', 'engine/.cargo/**', 'research/**/src/**', 'research/**/Cargo.toml', 'research/**/Cargo.lock', 'research/**/rust-toolchain.toml', 'research/**/.cargo/**', 'research/**/wasm/*.sh', 'research/**/wasm/*.py', 'research/**/reference-results/**', 'research/tools/asset_identity.py') }}
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            research/fracture/shauer-2025/wasm
            research/metamaterials/grossman-2026/wasm
          shared-key: research-wasm
      - name: Build research WASM and replay (cache miss)
        if: steps.research-assets.outputs.cache-hit != 'true'
        env:
          RESEARCH_SKIP_VIEWER: '1'
        run: |
          .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked --manifest-path research/fracture/shauer-2025/wasm/Cargo.toml
          .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked --manifest-path research/fracture/shauer-2025/Cargo.toml
          .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked --manifest-path research/metamaterials/grossman-2026/wasm/Cargo.toml
          nix develop --command research/fracture/shauer-2025/wasm/build.sh
          nix develop --command research/metamaterials/grossman-2026/wasm/build.sh
      - name: Install viewer dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Build viewer and publish matching asset identity (also on cache hits)
        run: |
          nix develop --command bash -c 'cd web && npx --no-install vite build -c vite.research-viewer.config.ts --outDir public/research-wasm/viewer --logLevel warn'
          python3 research/tools/publish_assets.py "$PWD" "$PWD/web/public/research-wasm/shauer-2025"
      - name: The browser bundle reproduces the reference (Node)
        run: nix develop --command node research/fracture/shauer-2025/wasm/check.mjs web/public/research-wasm/shauer-2025 research/fracture/shauer-2025/reference-results/ex2_steps.csv
      - name: The spring-network bundle gives the exact lattice answers (Node)
        run: nix develop --command node research/metamaterials/grossman-2026/wasm/check.mjs web/public/research-wasm/grossman-2026
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-wasm
          path: web/public/research-wasm
          retention-days: 3
          if-no-files-found: error

  # The site the e2e shards test, built once (each shard used to build it, prerender included,
  # inside Playwright's webServer). VITE_E2E=1 compiles the read-only test hooks in; the marker
  # says so, and playwright.config.ts refuses a prebuilt dist without it.
  site-e2e:
    name: E2E Site
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [changes, wasm, research-wasm]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Research WASM (from the research-wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name research-wasm --dir web/public/research-wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      # The build prerenders the public pages in a browser (web/scripts/prerender.ts).
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      - name: Build the E2E site
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.build NIX_RUN=
          else
            make e2e.web.build
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e
          path: web/dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The unit pass needs the WASM engine and nothing else, so it shards two ways;
  # the production-build tests need Chromium and the built app, so they stay
  # with the build.
  # GitHub's runners even when STABILEO_SELF_HOSTED is on: its budget tests time the app's
  # calculations, and next to five busy jobs on stabileo-ci-1 they ran over (scale-budget 2622 ms
  # against 1500).
  web-unit:
    name: Web Unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Unit + integration tests
        env:
          UNIT_AREA: ${{ needs.changes.outputs.unit_area }}
        run: make test.web.unit SHARD=${{ matrix.shard }}/2

  web-build:
    name: Web Build
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    needs: [changes, wasm, research-wasm]
    if: needs.changes.outputs.web_build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Research WASM and replay (same artifact as deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name research-wasm --dir web/public/research-wasm
      - name: Research runtime assets exist
        run: |
          test -s web/public/research-wasm/shauer-2025/phasefield.js
          test -s web/public/research-wasm/shauer-2025/phasefield_bg.wasm
          test -s web/public/research-wasm/shauer-2025/replay.srpl
          test -s web/public/research-wasm/viewer/viewer.js
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      - name: Typecheck against its baseline and svelte-check gate
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make typecheck.web NIX_RUN=
          else
            make typecheck.web
          fi
      # The runner lacks the system libraries Chromium links against; no make target installs them.
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      - name: Install build-test browser
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Build and production-build tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make test.web.build NIX_RUN=
          else
            make test.web.build
          fi
      - name: Built site includes the research runtime
        run: |
          test -s web/dist/research-wasm/shauer-2025/phasefield.js
          test -s web/dist/research-wasm/shauer-2025/phasefield_bg.wasm
          test -s web/dist/research-wasm/shauer-2025/replay.srpl
          test -s web/dist/research-wasm/viewer/viewer.js
      - name: Share tested production site with Docker smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-production
          path: web/dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Admin site build
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make admin.build NIX_RUN=
          else
            make admin.build
          fi

  # The results snapshot gate (#716, docs/verification/PROVENANCE.md): the reference corpus
  # solved through the app's path must give the committed snapshots (web/results-snapshots/),
  # and a pull request that changes them must register the change (an entry in
  # result-changes.json and a "BREAKING (results)" changelog fragment).
  results-snapshot:
    name: Results Snapshot
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && github.event_name != 'pull_request') && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [changes, wasm]
    if: needs.changes.outputs.results == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          # The merge commit and its first parent, the base the pull request is compared with.
          fetch-depth: 2
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: The corpus gives the committed snapshots
        run: make test.web.results
      # Not on a push to main: what reaches main went through the queue, where this ran.
      - name: A changed snapshot is registered
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$QUEUE_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
            make check.results-snapshot-gate BASE="$QUEUE_BASE"
          else
            make check.results-snapshot-gate BASE=HEAD^1
          fi

  # The WASM engine must give bit-identical results in every runtime it ships to
  # (docs/verification/TRUSTED_BASE.md): fixed solves and certificates in Chromium,
  # Firefox and WebKit, each compared bit for bit with the same run in Node.
  determinism:
    name: Determinism
    # Stays on GitHub's runners: nix-provided WebKit does not start on Linux hosts (checked
    # with scripts/ci/check-playwright-nix.sh on 2026-10-29); Chromium and Firefox do.
    runs-on: ubuntu-latest
    # On GitHub, browser system libraries come from apt (only browser binaries are
    # cached); a slow mirror day took the whole 40 minutes once. Headroom for that.
    timeout-minutes: 75
    needs: [changes, wasm]
    if: needs.changes.outputs.determinism == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-all-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Install browser system dependencies
        run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps chromium firefox webkit"
      - name: Install determinism browsers
        run: .github/scripts/retry-infra.sh nix develop --command bash -c 'cd web && npx playwright install chromium firefox webkit'
      - name: Bit-identical in Node and every browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: make test.web.determinism
      - name: Upload determinism artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-artifacts
          path: web/determinism/.artifacts
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # Ten shards, each running whole spec files chosen by measured duration
  # (web/scripts/e2e-shard.mjs). One runner took 40 min for the smoke suite:
  # 569 tests of ~3 s each, serially — `workers: 1` stays, for the WebGL
  # determinism the config explains, so the parallelism is across runners.
  # `playwright --shard` splits by test count in file order and put the three
  # heaviest files in one shard (12.6 vs 7.8 min); by duration it is 7.5 each
  # over five shards, 5.7 over ten. Five shards took 16–22 min each on a PR
  # and up to 55 in the queue, so the queue's critical path was one shard.
  e2e:
    name: E2E (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }})
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    needs: [changes, wasm, site-e2e]
    if: needs.changes.outputs.web == 'true'
    env:
      E2E_PREBUILT: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      # The VITE_E2E=1 site, built once by `site-e2e`; Playwright serves it (E2E_PREBUILT) and
      # refuses a dist without that job's marker.
      - name: E2E site (from the site-e2e job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name site-e2e --dir web/dist
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      # `@landing` stays out: on CI every landing case after the first wedges in
      # `browser.newContext`; run `npx playwright test --grep @landing` locally.
      # `@flaky` tests are quarantined (web/e2e/README.md): left out here, run by `e2e-flaky`.
      - name: Area E2E smoke suite
        if: needs.changes.outputs.scope != 'full'
        env:
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
          CI_SCOPE: ${{ needs.changes.outputs.scope }}
        run: nix develop --command bash -c 'cd web && python3 ../.github/scripts/run-area-e2e.py'
      - name: E2E smoke suite (shard ${{ matrix.shard }}/10)
        if: needs.changes.outputs.scope == 'full'
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.smoke SHARD=${{ matrix.shard }}/10 NIX_RUN=
          else
            make e2e.web.smoke SHARD=${{ matrix.shard }}/10
          fi
      # Heavier suite (408-member model): in the merge queue, so it runs on exactly what lands on
      # main, before it lands; on a PR only with the `run-e2e` label. On one shard it took 1.5 to
      # 2.3 hours. `--shard=N/5` split it by test count and left the Basic advanced sweep, 54 of
      # its 120 minutes, in shard 1 (49 min there, 6 in the lightest); it is balanced by duration
      # now, like the smoke suite, from its own table.
      - name: E2E slow suite (shard ${{ matrix.shard }}/10)
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.slow SHARD=${{ matrix.shard }}/10 NIX_RUN=
          else
            make e2e.web.slow SHARD=${{ matrix.shard }}/10
          fi
      # Non-blocking until the Linux baselines under web/e2e/__screenshots__/linux/
      # prove stable. Never pass --update-snapshots by default: it would overwrite
      # the baselines and leave the gate inert. UPDATE_SNAPSHOTS=1 refreshes them once.
      - name: E2E visual baselines (non-blocking comparison)
        if: matrix.shard == 1 && (github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
        continue-on-error: true
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.visual UPDATE_SNAPSHOTS=${{ vars.UPDATE_SNAPSHOTS == '1' && '1' || '' }} NIX_RUN=
          else
            make e2e.web.visual UPDATE_SNAPSHOTS=${{ vars.UPDATE_SNAPSHOTS == '1' && '1' || '' }}
          fi
      - name: Upload Linux screenshot baselines / diffs
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-screenshot-baselines
          path: web/e2e/__screenshots__/linux
          retention-days: 30
          if-no-files-found: ignore
      # Both paths are dot-directories, which upload-artifact skips unless told otherwise.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            web/e2e/.report
            web/e2e/.artifacts
            web/e2e/.results
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # The quarantined tests (`@flaky`, each with its issue: web/e2e/README.md), smoke and slow
  # alike, with two retries. NOT a required check: a red here is the issue's evidence, not a
  # reason to hold a merge. It keeps the quarantine visible, and it is where a fix shows it
  # held before the tag comes off.
  e2e-flaky:
    needs: [changes, wasm, site-e2e]
    if: needs.changes.outputs.flaky == 'true'
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      - name: E2E site (from the site-e2e job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name site-e2e --dir web/dist
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      # --pass-with-no-tests: an empty quarantine is the goal, not an error.
      - name: E2E quarantined (@flaky) tests, two retries
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.flaky NIX_RUN=
          else
            make e2e.web.flaky
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-flaky
          path: |
            web/e2e/.report
            web/e2e/.artifacts
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # Research validation, catalogue, isolation and route budgets (hosted runners only).
  research:
    needs: changes
    if: needs.changes.outputs.research == 'true'
    uses: ./.github/workflows/research.yml
    with:
      route_only: ${{ needs.changes.outputs.scope == 'tools' }}

  # The one required check. Path filters skip jobs, and a skipped required check counts as
  # passing, so branch protection requires this job instead of each job by name: it fails
  # when any job failed or was cancelled, and a skipped job is fine.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint-repo
      - test-ci-scripts
      - docker-smoke
      - lint-engine
      - test-engine-gates
      - test-engine-suite
      - test-engine-metamorphic
      - test-ai-backend
      - lint-backend
      - test-backend
      - check-migrations-immutable
      - check-migrations
      - wasm
      - research-wasm
      - research
      - site-e2e
      - web-unit
      - web-build
      - results-snapshot
      - determinism
      - e2e
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  rust:
    name: rust
    needs: ci-ok
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.ci-ok.result }}
        run: test "$RESULT" = success

  npm:
    name: npm
    needs: ci-ok
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.ci-ok.result }}
        run: test "$RESULT" = success
