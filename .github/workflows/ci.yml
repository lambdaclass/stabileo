        run: make services.stop

  check-migrations-immutable:
    name: Check Migrations Immutable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for modified migration files
        run: ./.github/scripts/check-migrations-immutable.sh "origin/${{ github.base_ref }}"

  revert-check:
    name: Revert Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The merge deletes no recent lines the branch never had
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ needs.changes.outputs.labels }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! git cat-file -e "$BASE:.github/scripts/revert-check.py"; then
            echo "$BASE has no revert check yet; the pull request's own copy is not trusted to judge it."
            exit 0
          fi
          git show "$BASE:.github/scripts/revert-check.py" > "$RUNNER_TEMP/revert-check.py"
          if [ "$EVENT" != merge_group ]; then
            if ! LABELS=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '[.labels[].name] | join(",")') &&
               ! { sleep 5; LABELS=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '[.labels[].name] | join(",")'); }; then
              echo "Couldn't read the labels of #$PR live; re-run Revert Check. Until then a reverts-ok label does not count."
              LABELS=$(tr , '\n' <<<"$PR_LABELS" | grep -vx reverts-ok | paste -sd, || true)
            fi
            echo "Labels: $LABELS"
            LABELS=$LABELS exec python3 -B -I "$RUNNER_TEMP/revert-check.py" "$BASE" HEAD --event ''
          fi
          status=0
          for step in $(git rev-list --first-parent --reverse "$BASE..HEAD"); do
            pr=$(git show -s --format=%s "$step" | sed -nE 's/^Merge pull request #([0-9]+) from .*/\1/p')
            merged=$(git rev-parse -q --verify "$step^2" || true)
            current=$({ [ -n "$pr" ] && gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha; } || true)
            if [ -z "$pr" ] || [ -z "$merged" ] || [ "$current" != "$merged" ]; then
              echo "$step is not the merge queue's merge of a pull request's current head, so whose acknowledgement applies is unknown."
              exit 1
            fi
            echo "Pull request #$pr:"
            LABELS=$(gh api "repos/$GH_REPO/pulls/$pr" --jq '[.labels[].name] | join(",")') python3 -B -I "$RUNNER_TEMP/revert-check.py" "$step^1" "$step^2" --event '' || status=1
          done
          exit "$status"
  check-migrations:
    name: Check Migration Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List new migrations
        id: new
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          ./.github/scripts/new-migrations.sh "$BASE" > "$RUNNER_TEMP/new-migrations.txt"
          cat "$RUNNER_TEMP/new-migrations.txt"
          if [ -s "$RUNNER_TEMP/new-migrations.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations to check."
          fi
      - if: runner.environment == 'github-hosted' && (steps.new.outputs.any == 'true')
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted' && steps.new.outputs.any == 'true'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && (steps.new.outputs.any == 'true')
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
        if: steps.new.outputs.any == 'true'
      - name: Cache deps
        if: steps.new.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Install dependencies
        if: steps.new.outputs.any == 'true'
        run: make deps
      - name: Check new migrations for production safety
        if: steps.new.outputs.any == 'true'
        run: |
          while IFS= read -r file; do
            make migrations.check.file FILE="$file"
          done < "$RUNNER_TEMP/new-migrations.txt"

  # The WASM engine, built once per run and shared by every web job (they used to build it nine
  # times: web-unit ×2, web-build, determinism, e2e ×5; with ten e2e shards it would be fourteen). The glue is gitignored, so without it
  # Vite would substitute a stub solver; the e2e readiness gate fails loudly if that happens.
  wasm:
    name: WASM
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && ((github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || (vars.STABILEO_PR_POOL == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && fromJSON('["self-hosted","stabileo-pr"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Pull request pool in use
        if: vars.STABILEO_PR_POOL == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && runner.environment != 'self-hosted'
        run: echo "::warning title=Pull request pool not used::STABILEO_PR_POOL is true, but this same-repository pull request ran on a GitHub-hosted runner. Check STABILEO_SELF_HOSTED and the stabileo-pr runners (Runner pools workflow)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: wasm
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Build WASM engine
        run: make wasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: web/src/lib/wasm
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The Stabileo Research page's WASM (research/fracture/shauer-2025/wasm), separate from the
  # engine's and served only to /research pages. The e2e site carries it so the research smoke
  # test runs the real simulation.
  research-wasm:
    name: Research WASM
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && ((github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || (vars.STABILEO_PR_POOL == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && fromJSON('["self-hosted","stabileo-pr"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 90
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
