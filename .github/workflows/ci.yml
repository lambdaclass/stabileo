  # The site the e2e shards test, built once (each shard used to build it, prerender included,
  # inside Playwright's webServer). VITE_E2E=1 compiles the read-only test hooks in; the marker
  # says so, and playwright.config.ts refuses a prebuilt dist without it.
  site-e2e:
    name: E2E Site
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && ((github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && (vars.STABILEO_E2E_POOL == 'true' && fromJSON('["self-hosted","stabileo-e2e"]') || fromJSON('["self-hosted","stabileo"]')) || (vars.STABILEO_PR_POOL == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && fromJSON('["self-hosted","stabileo-pr"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    needs: [changes, wasm, research-wasm]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Research WASM (from the research-wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name research-wasm --dir web/public/research-wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      # The build prerenders the public pages in a browser (web/scripts/prerender.ts).
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - name: Build the E2E site
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.build NIX_RUN=
          else
            make e2e.web.build
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e
          path: web/dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The unit pass needs the WASM engine and nothing else, so it shards eight ways;
  # the production-build tests need Chromium and the built app, so they stay
  # with the build.
  web-unit:
    name: Web Unit (${{ matrix.shard }}/8)
    permissions:
      contents: read
      actions: write
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && vars.STABILEO_TIMING_POOL == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule'))) && fromJSON('["self-hosted","stabileo-timing"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    needs: [changes, wasm]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.retest == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Unit + integration tests
        env:
          UNIT_AREA: ${{ needs.changes.outputs.unit_area }}
        run: make test.web.unit SHARD=${{ matrix.shard }}/8 BAIL=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && '1' || '' }}
      - name: Stop the rest of this run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run stop-failed-run.yml --ref main -f run_id="$RUN_ID"

  web-typecheck:
    name: Web Typecheck
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, wasm]
    if: needs.changes.outputs.web_build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Typecheck against its baseline and svelte-check gate
        run: make typecheck.web
      - name: Stop the rest of this run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run stop-failed-run.yml --ref main -f run_id="$RUN_ID"

  web-build:
    name: Web Build
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    needs: [changes, wasm, research-wasm]
    if: needs.changes.outputs.web_build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Research WASM and replay (same artifact as deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name research-wasm --dir web/public/research-wasm
      - name: Research runtime assets exist
        run: |
          test -s web/public/research-wasm/shauer-2025/phasefield.js
          test -s web/public/research-wasm/shauer-2025/phasefield_bg.wasm
          test -s web/public/research-wasm/shauer-2025/replay.srpl
          test -s web/public/research-wasm/viewer/viewer.js
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      # The runner lacks the system libraries Chromium links against; no make target installs them.
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - name: Install build-test browser
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Build and production-build tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NO_WALL_CLOCK: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make test.web.build NIX_RUN= NO_WALL_CLOCK="$NO_WALL_CLOCK"
          else
            make test.web.build NO_WALL_CLOCK="$NO_WALL_CLOCK"
          fi
      - name: Built site includes the research runtime
        run: |
          test -s web/dist/research-wasm/shauer-2025/phasefield.js
          test -s web/dist/research-wasm/shauer-2025/phasefield_bg.wasm
          test -s web/dist/research-wasm/shauer-2025/replay.srpl
          test -s web/dist/research-wasm/viewer/viewer.js
      - name: Share tested production site with Docker smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-production
          path: web/dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Admin site build
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make admin.build NIX_RUN=
          else
            make admin.build
          fi

  # The results snapshot gate (#716, docs/verification/PROVENANCE.md): the reference corpus
  # solved through the app's path must give the committed snapshots (web/results-snapshots/),
  # and a pull request that changes them must register the change (an entry in
  # web/src/lib/provenance/result-changes/ and a "BREAKING (results)" changelog fragment).
  results-snapshot:
    name: Results Snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, wasm]
    if: needs.changes.outputs.results == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: The corpus gives the committed snapshots
        run: make test.web.results
      # Not on a push to main: what reaches main went through the queue, where this ran.
      - name: A changed snapshot is registered
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$QUEUE_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
            make check.results-snapshot-gate BASE="$QUEUE_BASE"
          else
            make check.results-snapshot-gate BASE=HEAD^1
          fi

  # The WASM engine must give bit-identical results in every runtime it ships to
  # (docs/verification/TRUSTED_BASE.md): fixed solves and certificates in Chromium,
  # Firefox and WebKit, each compared bit for bit with the same run in Node.
  determinism:
    name: Determinism
    # Stays on GitHub's runners: nix-provided WebKit does not start on Linux hosts (checked
    # with scripts/ci/check-playwright-nix.sh on 2026-10-29); Chromium and Firefox do.
    runs-on: ubuntu-24.04
    # On GitHub, browser system libraries come from apt (only browser binaries are
    # cached); a slow mirror day took the whole 40 minutes once. Headroom for that.
    timeout-minutes: 75
    needs: [changes, wasm]
    if: needs.changes.outputs.determinism == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-all-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: Install browser system dependencies
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium firefox webkit
      - name: Install determinism browsers
        run: .github/scripts/retry-infra.sh nix develop --command bash -c 'cd web && npx playwright install chromium firefox webkit'
      - name: Bit-identical in Node and every browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: make test.web.determinism
      - name: Upload determinism artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-artifacts
          path: web/determinism/.artifacts
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # E2E_SHARDS (select-ci.py) shards, each running whole spec files chosen by the measured durations
  # in web/e2e/shard-timings.json (web/scripts/e2e-shard.mjs); `workers: 1` stays, for the WebGL
  # determinism the config explains, so the parallelism is across runners. The slowest shard is
  # the queue's critical path: refresh the table from a queue run's reports when shards drift apart.
  e2e:
    name: E2E (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, wasm, site-e2e]
    if: needs.changes.outputs.web == 'true'
    env:
      E2E_PREBUILT: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # Built once per run by the `wasm` job, the same build as the shipped app.
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      # The VITE_E2E=1 site, built once by `site-e2e`; Playwright serves it (E2E_PREBUILT) and
      # refuses a dist without that job's marker.
      - name: E2E site (from the site-e2e job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name site-e2e --dir web/dist
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      # `@landing` stays out: on CI every landing case after the first wedges in
      # `browser.newContext`; run `npx playwright test --grep @landing` locally.
      # `@flaky` tests are quarantined (web/e2e/README.md): left out here, run by `e2e-flaky`.
      - name: Measured E2E timings (from a recent main or merge-queue run)
        if: needs.changes.outputs.e2e_timings_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TIMINGS_RUN: ${{ needs.changes.outputs.e2e_timings_run }}
        run: |
          .github/scripts/retry-infra.sh gh run download "$TIMINGS_RUN" --name e2e-timings --dir web/e2e/.timings
          test -s web/e2e/.timings/shard-timings.json
          echo "E2E_SHARD_TIMINGS=e2e/.timings/shard-timings.json" >> "$GITHUB_ENV"
      - name: Area E2E smoke suite
        if: needs.changes.outputs.scope != 'full' && needs.changes.outputs.scope != 'site'
        env:
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
          CI_SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e --command bash -c 'cd web && python3 ../.github/scripts/run-area-e2e.py'
          else
            nix develop --command bash -c 'cd web && python3 ../.github/scripts/run-area-e2e.py'
          fi
      - name: E2E smoke suite (shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }})
        if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'site'
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.smoke SHARD=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }} NIX_RUN=
          else
            make e2e.web.smoke SHARD=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }}
          fi
      - name: E2E slow suite (shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }})
        id: slow
        if: needs.changes.outputs.slow_e2e == 'true' || needs.changes.outputs.run_e2e == 'true'
        env:
          NO_WALL_CLOCK: ${{ runner.environment == 'self-hosted' && '1' || '' }}
          E2E_SLOW_SPECS: ${{ needs.changes.outputs.slow_specs }}
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.slow SHARD=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }} NIX_RUN= NO_WALL_CLOCK="$NO_WALL_CLOCK"
          else
            make e2e.web.slow SHARD=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }} NO_WALL_CLOCK="$NO_WALL_CLOCK"
          fi
      # Non-blocking until the Linux baselines under web/e2e/__screenshots__/linux/
      # prove stable. Never pass --update-snapshots by default: it would overwrite
      # the baselines and leave the gate inert. UPDATE_SNAPSHOTS=1 refreshes them once.
      - name: E2E visual baselines (non-blocking comparison)
        if: matrix.shard == 1 && (needs.changes.outputs.slow_e2e == 'true' || needs.changes.outputs.run_e2e == 'true')
        continue-on-error: true
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.visual UPDATE_SNAPSHOTS=${{ vars.UPDATE_SNAPSHOTS == '1' && '1' || '' }} NIX_RUN=
          else
            make e2e.web.visual UPDATE_SNAPSHOTS=${{ vars.UPDATE_SNAPSHOTS == '1' && '1' || '' }}
          fi
      - name: Upload Linux screenshot baselines / diffs
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-screenshot-baselines
          path: web/e2e/__screenshots__/linux
          retention-days: 30
          if-no-files-found: ignore
      - name: Slow suite outcome
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OUTCOME: ${{ steps.slow.outcome }}
        run: |
          mkdir -p e2e-slow
          echo "${OUTCOME:-skipped}" > e2e-slow/outcome
          if [ -f web/e2e/.results/slow.json ]; then cp web/e2e/.results/slow.json e2e-slow/; fi
      - name: Upload slow suite outcome
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-slow-${{ matrix.shard }}
          path: e2e-slow
          retention-days: 3
          if-no-files-found: warn
      - name: Upload smoke timings
        if: success() && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'site') && (github.event_name == 'merge_group' || github.event_name == 'push')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: web/e2e/.results/smoke.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      # Both paths are dot-directories, which upload-artifact skips unless told otherwise.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            web/e2e/.report
            web/e2e/.artifacts
            web/e2e/.results
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # The smoke timings of this run, for the next runs' shard balance (web/scripts/e2e-shard.mjs).
  e2e-timings:
    name: E2E shard timings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, e2e]
    if: needs.e2e.result == 'success' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'site') && (github.event_name == 'merge_group' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every shard's smoke report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh gh run download "$RUN_ID" --pattern 'e2e-results-*' --dir e2e-results
      - name: Timings table
        env:
          TOTAL: ${{ needs.changes.outputs.e2e_total }}
        run: |
          reports=(e2e-results/*/smoke.json)
          [ "${#reports[@]}" = "$TOTAL" ] || { echo "expected $TOTAL shard reports, found ${#reports[@]}"; exit 1; }
          mkdir -p timings
          E2E_SHARD_TIMINGS=$PWD/timings/shard-timings.json node web/scripts/e2e-shard.mjs --update "${reports[@]/#/$PWD/}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings
          path: timings/shard-timings.json
          retention-days: 30
          if-no-files-found: error

  # The quarantined tests (`@flaky`, each with its issue: web/e2e/README.md), smoke and slow
  # alike, with two retries. NOT a required check: a red here is the issue's evidence, not a
  # reason to hold a merge. It keeps the quarantine visible, and it is where a fix shows it
  # held before the tag comes off.
  e2e-flaky:
    needs: [changes, wasm, site-e2e]
    if: needs.changes.outputs.flaky == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          if [ "${{ runner.environment }}" = self-hosted ]; then
            .github/scripts/retry-infra.sh nix develop .#e2e --command true
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: WASM engine (from the wasm job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name wasm --dir web/src/lib/wasm
      - name: Install dependencies
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c .github/scripts/retry-infra.sh make web.deps NIX_RUN=
          else
            .github/scripts/retry-infra.sh make web.deps
          fi
      - name: E2E site (from the site-e2e job)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh nix develop --command gh run download "$RUN_ID" --name site-e2e --dir web/dist
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      # --pass-with-no-tests: an empty quarantine is the goal, not an error.
      - name: E2E quarantined (@flaky) tests, two retries
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            nix develop .#e2e -c make e2e.web.flaky NIX_RUN=
          else
            make e2e.web.flaky
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-flaky
          path: |
            web/e2e/.report
            web/e2e/.artifacts
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # Research validation, catalogue, isolation and route budgets (hosted runners only).
  research:
    needs: changes
    if: needs.changes.outputs.research == 'true'
    uses: ./.github/workflows/research.yml
    with:
      route_only: ${{ needs.changes.outputs.research_route_only == 'true' }}

  # The one required check. Path filters skip jobs, and a skipped required check counts as
  # passing, so branch protection requires this job instead of each job by name: it fails
  # when any job failed or was cancelled, and a skipped job is fine.
  # Wall-clock budgets on shared runners: on pull requests and the merge queue an overrun is
  # reported, not failed (WALL_CLOCK_REPORT); every other failure of these tests still fails.
  timing-budgets:
    name: Timing Budgets
    runs-on: ubuntu-24.04
    needs: [changes, wasm, site-e2e]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.retest == 'true' && (github.event_name != 'pull_request' || vars.STABILEO_PR_POOL == 'true')
    timeout-minutes: 60
    outputs:
      scale: ${{ steps.scale.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - if: github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: WASM engine (from the wasm job)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasm
          path: web/src/lib/wasm
      - name: Install dependencies
        run: .github/scripts/retry-infra.sh make web.deps
      - name: E2E site (from the site-e2e job)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-e2e
          path: web/dist
      - name: Install Chromium
        run: .github/scripts/retry-infra.sh make e2e.web.setup
      - name: Install Chromium system dependencies
        uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - name: Scale budgets
        id: scale
        env:
          WALL_CLOCK_REPORT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/wall-clock-overruns.jsonl', runner.temp) || '' }}
        run: make test.web.timing
      - name: E2E wall-clock budgets
        id: e2e
        if: ${{ !cancelled() }}
        env:
          WALL_CLOCK_REPORT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/wall-clock-overruns.jsonl', runner.temp) || '' }}
        run: make e2e.web.timing
      - name: Report budget overruns without failing
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          OVERRUNS: ${{ runner.temp }}/wall-clock-overruns.jsonl
        run: |
          [ -s "$OVERRUNS" ] || exit 0
          echo "Timing budgets over; reported only on pull requests and the merge queue, enforced on main and nightly (#1562):" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Timing Budgets::$line"
            echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$OVERRUNS"

  # Main only, apart from the job that runs proposed code: the only job here that may write issues.
  timing-budgets-alert:
    name: Timing Budgets issue
    runs-on: ubuntu-24.04
    needs: timing-budgets
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main' && needs.timing-budgets.result != 'skipped' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the Timing Budgets issue
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          SCALE_OUTCOME: ${{ needs.timing-budgets.outputs.scale }}
          E2E_OUTCOME: ${{ needs.timing-budgets.outputs.e2e }}
        with:
          script: |
            const alert = require('./.github/scripts/timing-budget-alert.cjs');
            await alert({ github, context, core });

  superseded:
    name: Superseded by a newer run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'pull_request' && cancelled() }}
    needs:
      - changes
      - lint-repo
      - test-ci-scripts
      - docker-smoke
      - caddy-routing
      - caddy-redirects
      - lint-engine
      - test-engine-gates
      - test-engine-suite
      - test-engine-metamorphic
      - test-engine-quick
      - test-ai-backend
      - lint-backend
      - test-backend
      - check-migrations-immutable
      - check-migrations
      - revert-check
      - wasm
      - research-wasm
      - research
      - site-e2e
      - web-unit
      - web-build
      - web-typecheck
      - results-snapshot
      - determinism
      - e2e
      - timing-budgets
    outputs:
      newer: ${{ steps.newer.outputs.newer }}
    steps:
      - id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          newer=$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$SHA&per_page=100" \
            --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .id > $RUN_ID and ([.pull_requests[].number] | index($PR)) and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          echo "newer runs on $SHA: $newer"
          [ "$newer" -gt 0 ] && echo newer=true >> "$GITHUB_OUTPUT" || echo newer=false >> "$GITHUB_OUTPUT"

  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    # A skipped CI OK passes a required check: it may skip only when a newer run on the same head replaces it.
    if: ${{ always() && needs.superseded.outputs.newer != 'true' }}
    needs:
      - superseded
      - changes
      - lint-repo
      - test-ci-scripts
      - docker-smoke
      - caddy-routing
      - caddy-redirects
      - lint-engine
      - test-engine-gates
      - test-engine-suite
      - test-engine-metamorphic
      - test-engine-quick
      - test-ai-backend
      - lint-backend
      - test-backend
      - check-migrations-immutable
      - check-migrations
      - revert-check
      - wasm
      - research-wasm
      - research
      - site-e2e
      - web-unit
      - web-build
      - web-typecheck
      - results-snapshot
      - determinism
      - e2e
      - timing-budgets
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.slow_e2e == 'true' || needs.changes.outputs.run_e2e == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Every shard's slow suite outcome
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.slow_e2e == 'true' || needs.changes.outputs.run_e2e == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/retry-infra.sh gh run download "$RUN_ID" --pattern 'e2e-slow-*' --dir e2e-slow
      - name: Open, update or close the @slow E2E issue
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.slow_e2e == 'true' || needs.changes.outputs.run_e2e == 'true')
        continue-on-error: true
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          E2E_TOTAL: ${{ needs.changes.outputs.e2e_total }}
        with:
          script: |
            const alert = require('./.github/scripts/slow-e2e-alert.cjs');
            await alert({ github, context, core });
