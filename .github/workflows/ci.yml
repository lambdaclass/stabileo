# Infrastructure: self-hosted runners use installed Nix/local store; hosted installer/cache
# failures are advisory (use-flakehub: false). Nix acquisition must still succeed.
# retry-infra.sh retries dependency downloads twice only for known infra log patterns;
# builds/tests/timeouts are never retried. Optional Actions caches may fail open.
# Top-level full PR build audit, excluding builds spawned by tests:
# engine WASM 5 (WASM job, Docker source, three research validation jobs); research WASM sets 2 (1 on source-cache hit); site builds
# 6: production, E2E, admin, Docker source, and route-budget main/candidate.
# Docker tests the site-production path on every PR and the source path when the Dockerfile or a
# pin it reads changes (select-ci.py), and both on main; E2E shards share site-e2e.
# Research cache excludes viewer: always rebuild viewer and republish asset identity.
# Research WASM keeps the 60-minute budget for the expanded research crate set.
# PR and merge-queue selection (docs/changelog may accompany any single area):
# docs/**, root *.md, changelog.d/**, specs/**/*.md: repository lint/changelog only; research/**/*.md (not tools): plus research.
# backend/** (Elixir; nothing in the engine, web or Docker builds reads it), alone or with docs: the backend jobs only.
# research/**, web/src/components/research/**, web/e2e/research*.spec.ts:
# research validation/WASM, research unit + E2E, route budgets, shared WASM/site.
# web/src/components/tools/** (+ tools*.spec.ts): tools unit + E2E, route budgets;
# missing area tests conservatively select full CI.
# engine/**: engine/AI-backend/research suites, determinism/results, full web unit, @engine smoke.
# Other web/** (site, blog, locales, e2e; not package manifests or WASM): everything but the engine,
# AI-backend and backend jobs and full research validation (route checks only), with the full E2E smoke suite.
# Merge queue: each entry by its diff against the entry ahead; docs only, backend only, or site/research/tools only
# (engine jobs skipped, research route checks only); else full.
# Every web selection includes Web Build and its TypeScript/Svelte gates.
# Other/mixed/unknown paths and run-e2e label: full pipeline. The label is read when the run starts:
# adding it does not start a run (any label would restart CI); push or re-run CI after adding it.
# Only pull_request and merge_group selection is narrowed by path. The merge queue skips the heavy jobs that
# combining PRs rarely breaks (slow E2E, visual baselines, Docker smoke, Determinism, quarantined
# E2E, research validation beyond route budgets); pushes to main and the nightly schedule run
# everything, and post-merge.yml opens a revert PR when a main push fails. A push to main whose
# tree a successful merge-queue CI run built (main-tested.py, checked through the API) runs only
# what the queue skipped plus the WASM, site and E2E jobs those need.
# CI OK accepts intentional skips but rejects failures/cancellations, including detection.
name: CI

on:
  push:
    branches: [main]
  # Every base branch: PRs stacked on another PR get CI too.
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: each PR is tested on top of the ones merging before it, so two PRs that
  # are green on their own cannot break main together.
  merge_group:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'push-main' || github.run_id }}
  # Never share a group with merge-queue runs: a third run in a shared group cancels the pending one, even without cancel-in-progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  MIX_ENV: test
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4
  NEXTEST_TEST_THREADS: 4
  RAYON_NUM_THREADS: 4
  VITEST_MAX_THREADS: 3
  VITEST_MAX_FORKS: 3
  BINARYEN_CORES: 4
  GOMAXPROCS: 4

# Every job installs the toolchain from flake.nix and runs a make target, so a
# job that passes here passes on a developer's machine with the same command.
#
# Self-hosted runners on stabileo-ci-1 (dotfiles servers/runners-stabileo.sh). With
# STABILEO_SELF_HOSTED 'true', the jobs that build or test run on `[self-hosted, stabileo]` for
# merge_group and pushes to main. Pull requests from this repository's own branches take the host
# (`[self-hosted, stabileo-pr]`, with STABILEO_PR_POOL 'true') only for the cache-heavy builds on
# their critical path: WASM, Research WASM and the e2e site. Every other pull request job runs on
# GitHub, where thirty start at once, instead of queueing for the few `stabileo-pr` runners.
# Fork and Dependabot pull requests stay on GitHub: the repo is public, and their code must never
# reach a persistent runner. Engine Gates, Web Unit and the research engine benchmarks time
# themselves, so outside pull requests they go to `[self-hosted, stabileo-timing]` (runners pinned
# to cores no other runner uses) when STABILEO_TIMING_POOL is 'true' too, and to GitHub otherwise.
# With STABILEO_ENGINE_POOL 'true', Engine Suite and Engine Metamorphic take `[self-hosted,
# stabileo-engine]` (concrete-ci-3), so the queue's critical path (WASM, Research WASM, E2E Site)
# never waits behind them for a `stabileo` runner.
# On GitHub always: Detect Changes and CI OK (no build work; a full host must not delay them),
# the checks that take a minute or less (CI scripts, backend lint, migrations, results snapshot,
# research catalog and isolation), the E2E shards (they all start at once there and only download
# the wasm and site artifacts),
# Determinism (Nix WebKit does not start on the host) and Docker build smoke (no Docker for runner
# users). Self-hosted jobs skip the Nix installer, rust-cache, magic-nix-cache and free-disk; each
# runner keeps its own CARGO_TARGET_DIR.
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      retest: ${{ steps.select.outputs.retest }}
      engine: ${{ steps.select.outputs.engine }}
      web: ${{ steps.select.outputs.web }}
      research: ${{ steps.select.outputs.research }}
      research_route_only: ${{ steps.select.outputs.research_route_only }}
      slow_e2e: ${{ steps.select.outputs.slow_e2e }}
      docker: ${{ steps.select.outputs.docker }}
      docker_source: ${{ steps.select.outputs.docker_source }}
      backend: ${{ steps.select.outputs.backend }}
      ai_backend: ${{ steps.select.outputs.ai_backend }}
      ci_scripts: ${{ steps.select.outputs.ci_scripts }}
      scope: ${{ steps.select.outputs.scope }}
      unit_area: ${{ steps.select.outputs.unit_area }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
      slow_specs: ${{ steps.select.outputs.slow_specs }}
      e2e_shards: ${{ steps.select.outputs.e2e_shards }}
      e2e_total: ${{ steps.select.outputs.e2e_total }}
      web_build: ${{ steps.select.outputs.web_build }}
      flaky: ${{ steps.select.outputs.flaky }}
      determinism: ${{ steps.select.outputs.determinism }}
      results: ${{ steps.select.outputs.results }}
      run_e2e: ${{ steps.labels.outputs.run_e2e == 'true' }}
      labels: ${{ steps.labels.outputs.names }}
      e2e_timings_run: ${{ steps.timings.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          list-files: json
          filters: |
            all:
              - '**'
            tooling: &tooling
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - '.nvmrc'
              - 'scripts/wasm-cached.sh'
              - 'scripts/ci/check-playwright-nix.sh'
              - 'Makefile'
              - '.github/workflows/*.yml'
              - '.github/actions/**'
            engine:
              - *tooling
              - 'engine/**'
              - 'scripts/check-fail-closed.py'
              - 'scripts/fail-closed-allow.txt'
              - 'scripts/check-message-matching.py'
              - 'scripts/message-match-allow.txt'
              - 'scripts/invariance-gate.py'
              - 'docs/verification/METAMORPHIC.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/**'
            docker:
              - *tooling
              - 'Dockerfile'
              - '.dockerignore'
              - 'web/**'
              - 'research/**'
              - 'engine/**'
              - 'ai-backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'Dockerfile'
              - '.dockerignore'
              - *tooling
              - 'web/**'
              - 'scripts/check-message-matching.py'
              - 'scripts/message-match-allow.txt'
              # The /research pages import the catalog and reference results and ship its WASM.
              - 'research/**'
              - 'engine/**'
              # The engine's dependencies (wasm-bindgen, serde) are locked here.
              - 'Cargo.toml'
              - 'Cargo.lock'
            research:
              - *tooling
              - 'research/**'
              - 'web/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/research.yml'
            backend:
              - *tooling
              - 'backend/**'
            ai_backend:
              - *tooling
              - 'ai-backend/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ci_scripts:
              - 'scripts/check-containment.py'
              - 'scripts/invariance-gate.py'
              - '.github/workflows/research.yml'
              - 'scripts/nightly-*.py'
              - 'scripts/replay-findings.py'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/supply-chain.yml'
              - '.github/workflows/merge-queue-supersede.yml'
              - '.github/workflows/post-merge.yml'
              - 'scripts/tests/**'
              - 'scripts/ci/**'
              - 'scripts/verification-metrics.py'
              - 'scripts/check-fail-closed.py'
              - 'scripts/check-message-matching.py'
              - 'scripts/message-match-allow.txt'
              - 'docs/roadmap/PRODUCT_ROADMAP.md'
              - 'Makefile'
              - 'Dockerfile'
              - '.github/scripts/**'
              - '.github/workflows/*.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'web/package-lock.json'
      - name: Was this tree already tested in the merge queue
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/main-tested.py
      - name: Labels as they are now (a re-run sees a label added after the push)
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          names=$(.github/scripts/retry-infra.sh gh api "repos/$GH_REPO/pulls/$PR" --jq '.labels[].name')
          if grep -qx run-e2e <<<"$names"; then echo "run_e2e=true"; else echo "run_e2e=false"; fi >> "$GITHUB_OUTPUT"
          echo "names=$(paste -sd, <<<"$names")" >> "$GITHUB_OUTPUT"
      - name: Select PR jobs (all jobs for trusted events)
        id: select
        env:
          TESTED: ${{ steps.tested.outputs.tested }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          FORCE_FULL: ${{ steps.labels.outputs.run_e2e == 'true' }}
        run: python3 .github/scripts/select-ci.py
      # Every E2E shard balances from this one table, so a run that cannot read it uses the committed one everywhere.
      - name: Latest measured E2E timings (main or merge queue)
        id: timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=
          for id in $(gh api "repos/$GH_REPO/actions/artifacts?name=e2e-timings&per_page=20" \
            --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main" or (.workflow_run.head_branch | startswith("gh-readonly-queue/main/"))) | .workflow_run.id'); do
            trusted=$(gh api "repos/$GH_REPO/actions/runs/$id" | jq -r --arg repo "$GH_REPO" \
              'select((.event == "push" or .event == "merge_group") and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo and .repository.full_name == $repo) | .id')
            if [ "$trusted" = "$id" ]; then run=$id; break; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "E2E timings from run: ${run:-none (the committed table)}"

  docker-smoke:
    name: Docker build smoke
    needs: [changes, web-build]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Download tested production site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          .github/scripts/retry-infra.sh gh run download "$RUN_ID" --name site-production --dir ci-site
          test -s ci-site/index.html
      # Also exercise Compose's default frontend/WASM compiler stages.
      - if: needs.changes.outputs.docker_source == 'true'
        run: .github/scripts/retry-infra.sh make result-changes.order
      - if: needs.changes.outputs.docker_source == 'true'
        run: docker build --tag stabileo-source-smoke .
      - run: docker build --build-arg FRONTEND_STAGE=web-prebuilt --tag stabileo-smoke .

  caddy-routing:
    name: Caddy Routing
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - run: .github/scripts/retry-infra.sh make test.infra.caddy

  caddy-redirects:
    name: Caddy Language Redirects
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shells (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
          .github/scripts/retry-infra.sh nix shell --inputs-from . nixpkgs#caddy nixpkgs#curl nixpkgs#python3 --command true
      - run: make test.infra.caddy.redirects

  # One version of each tool everywhere (rust-toolchain.toml, .nvmrc, flake.nix and the
  # workflows), and changelog.d/ fragments well formed. On every run: neither has a path filter.
  lint-repo:
    name: Lint Repo
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Toolchain pins agree
        run: nix develop --command make check-pins NIX_RUN=
      - name: Changelog fragments are well formed
        run: nix develop --command make check.changelog NIX_RUN=
      # The engine's test files are modules of a few listed binaries (autotests = false): a file
      # in no binary would never run, one in two would run twice.
      - name: Every engine test file is in exactly one test binary
        run: nix develop --command make check.test-targets NIX_RUN=
      - name: Stop the rest of this run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run stop-failed-run.yml --ref main -f run_id="$RUN_ID"

  test-ci-scripts:
    name: Test CI Scripts
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.ci_scripts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Shellcheck
        run: make test.ci-scripts
      - name: Prepare the browser shell (infrastructure retries)
        run: .github/scripts/retry-infra.sh nix develop .#e2e --command true
      - name: Browser shell (.#e2e) launches Chromium and Firefox
        run: nix develop .#e2e -c ./scripts/ci/check-playwright-nix.sh
      - name: Stop the rest of this run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run stop-failed-run.yml --ref main -f run_id="$RUN_ID"

  lint-engine:
    name: Lint Engine
    permissions:
      contents: read
      actions: write
    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-lint
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Clippy
        env:
          BENCHMARK_GATE_LABELS: ${{ needs.changes.outputs.labels }}
        run: make lint.engine

      - name: Stop the rest of this run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run stop-failed-run.yml --ref main -f run_id="$RUN_ID"

  # Named correctness gates. Every gate's tests are EXCLUDED from the suite
  # job below — each test must run exactly once per CI run. The make targets
  # (test.engine.gates / test.engine.suite) keep the two in step.
  test-engine-gates:
    name: Engine Gates
    runs-on: ${{ (vars.STABILEO_SELF_HOSTED == 'true' && vars.STABILEO_TIMING_POOL == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule'))) && fromJSON('["self-hosted","stabileo-timing"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          shared-key: engine-test
      - name: Fetch Rust dependencies
        run: .github/scripts/retry-infra.sh nix develop --command cargo fetch --locked
      - name: Named correctness gates
        env:
          WALL_CLOCK_REPORT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/engine-wall-clock-overruns.jsonl', runner.temp) || '' }}
        run: make test.engine.gates
      - name: Report wall-clock overruns without failing
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          OVERRUNS: ${{ runner.temp }}/engine-wall-clock-overruns.jsonl
        run: |
          [ -s "$OVERRUNS" ] || exit 0
          echo "Engine wall-clock budgets over; reported only on pull requests and the merge queue, enforced on main and nightly (#1562):" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Engine wall-clock budgets::$line"
            echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$OVERRUNS"

