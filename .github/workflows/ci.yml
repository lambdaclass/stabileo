    runs-on: ${{ vars.STABILEO_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule')) && fromJSON('["self-hosted","stabileo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        continue-on-error: true
      - if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false
      - name: Prepare Nix shell (infrastructure retries)
        run: |
          .github/scripts/retry-infra.sh nix develop --command true
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: A PostgreSQL port of this runner's own
        if: runner.environment == 'self-hosted'
        run: |
          n=${RUNNER_NAME##*[!0-9]}
          echo "PGPORT=$((5460 + ${n:-0}))" >> "$GITHUB_ENV"
      - name: Start PostgreSQL and set up the database
        run: make setup
      - name: Run tests
        run: make test.backend
