name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src

      # Noninteractive and needrestart-proof: an apt prompt or a stalled mirror
      # here hangs the job until the 6 h default timeout (seen on main and on
      # PR #154, 2026-08-19 — the job sat in this step for over an hour). The
      # step timeout turns the hang into a fast failure.
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Clippy
        working-directory: engine
        run: cargo clippy --lib -- -W clippy::all -A clippy::erasing_op

  # Named correctness gates. Every gate's tests are EXCLUDED from the suite
  # job below — each test must run exactly once per CI run. If you add a gate
  # step here, add its filter to the suite exclusion as well (verified with:
  # cargo nextest list --profile ci -E '<filter>' | wc -l — suite + gates must
  # equal the old combined filter's count).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Noninteractive and needrestart-proof: an apt prompt or a stalled mirror
      # here hangs the job until the 6 h default timeout (seen on main and on
      # PR #154, 2026-08-19 — the job sat in this step for over an hour). The
      # step timeout turns the hang into a fast failure.
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@nextest

      - name: Shell benchmarks gate
        working-directory: engine
        run: cargo nextest run --profile ci -E 'test(/benchmark_shell/) + test(/benchmark_beam_shell/) + test(/benchmark_plate/) + test(/benchmark_navier/) + test(/benchmark_scordelis/) + test(/benchmark_cantilever/) + test(/benchmark_pinched/) + test(/test_quad_thin_plate/)'

      - name: Shell acceptance gate
        working-directory: engine
        run: cargo nextest run --profile ci -E 'test(/acceptance_.*shell/) + test(/acceptance_.*diaphragm/)'

      - name: Constraint benchmarks gate
        working-directory: engine
        run: cargo nextest run --profile ci -E 'test(/benchmark_.*constraint/)'

      - name: Sparse shell gates
        working-directory: engine
        run: cargo nextest run --profile ci --test sparse_shell_gates

      - name: Solver invariants gate
        working-directory: engine
        run: cargo nextest run --profile ci --test solver_invariants

      - name: Solver CI coverage gate
        working-directory: engine
        run: cargo nextest run --profile ci --test solver_ci_coverage

      - name: Conditioning adversarial gate
        working-directory: engine
        run: cargo nextest run --profile ci --test conditioning_adversarial

      # Wall-clock timing gates: run single-threaded so elapsed time reflects
      # CPU work, not contention from co-scheduled tests on shared 2-4 vCPU
      # runners. Measuring wall time under parallel execution made these flaky.
      - name: Performance regression gates
        working-directory: engine
        run: cargo nextest run --profile ci --test perf_regression_gates --test-threads 1

      - name: Advanced perf gates
        working-directory: engine
        run: cargo nextest run --profile ci --test perf_regression_advanced --test-threads 1

      - name: k_full overbuild gates
        working-directory: engine
        run: cargo nextest run --profile ci --test kfull_overbuild_gates

  # The remaining ~6700 tests, sharded 2-way. Excludes the named gates above
  # (they run in the `test` job) and the wall-clock timing benchmarks/perf
  # binaries (validated in their dedicated single-threaded gate steps).
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Noninteractive and needrestart-proof: an apt prompt or a stalled mirror
      # here hangs the job until the 6 h default timeout (seen on main and on
      # PR #154, 2026-08-19 — the job sat in this step for over an hour). The
      # step timeout turns the hang into a fast failure.
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@nextest

      - name: Run test suite (shard ${{ matrix.shard }}/2)
        working-directory: engine
        run: cargo nextest run --profile ci -E 'all() - test(harmonic_phase_breakdown) - test(harmonic_modal_vs_direct_timing) - binary(perf_regression_advanced) - binary(perf_regression_gates) - (test(/benchmark_shell/) + test(/benchmark_beam_shell/) + test(/benchmark_plate/) + test(/benchmark_navier/) + test(/benchmark_scordelis/) + test(/benchmark_cantilever/) + test(/benchmark_pinched/) + test(/test_quad_thin_plate/)) - (test(/acceptance_.*shell/) + test(/acceptance_.*diaphragm/)) - test(/benchmark_.*constraint/) - binary(sparse_shell_gates) - binary(solver_invariants) - binary(solver_ci_coverage) - binary(conditioning_adversarial) - binary(kfull_overbuild_gates)' --partition count:${{ matrix.shard }}/2
        timeout-minutes: 20

  # Criterion reports are informational (continue-on-error): they must not gate
  # PRs, so they only run on main. Artifact cadence is unchanged (every main push).
  bench:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Noninteractive and needrestart-proof: an apt prompt or a stalled mirror
      # here hangs the job until the 6 h default timeout (seen on main and on
      # PR #154, 2026-08-19 — the job sat in this step for over an hour). The
      # step timeout turns the hang into a fast failure.
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Benchmarks compile
        working-directory: engine
        run: cargo bench --no-run

      # Informational only: criterion reports are uploaded as artifacts below.
      # Benchmark wall time on shared runners must not gate CI (same rationale
      # as the single-threaded perf gates above) — slow runners exceeded the
      # timeout with no correctness signal in the failure.
      - name: Run criterion benchmarks (quick)
        working-directory: engine
        run: cargo bench --bench solver_bench --bench assembly_bench --bench workflow_bench -- --sample-size 10 --warm-up-time 1 --measurement-time 3
        timeout-minutes: 15
        continue-on-error: true

      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: engine/target/criterion
          retention-days: 30
          if-no-files-found: warn

  # The engine ships to the browser as WebAssembly. This builds it for that
  # target exactly as a consumer does, so a change that compiles natively but
  # not for wasm32 fails here rather than in the application that consumes it.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # engine/rust-toolchain.toml pins the toolchain and the wasm32 target;
      # rustup installs both when wasm-pack first runs cargo there.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: bash .github/scripts/install-wasm-pack.sh
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build the WebAssembly package
        run: make wasm
