name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test

# Every job installs the toolchain from flake.nix and runs a make target, so a
# job that passes here passes on a developer's machine with the same command.
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      ai_backend: ${{ steps.filter.outputs.ai_backend }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            toolchain: &toolchain
              - 'flake.nix'
              - 'flake.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            engine:
              - *toolchain
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/**'
            web:
              - *toolchain
              - 'web/**'
              - 'engine/**'
            backend:
              - *toolchain
              - 'backend/**'
            ai_backend:
              - *toolchain
              - 'ai-backend/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ci_scripts:
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  test-ci-scripts:
    name: Test CI Scripts
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ci_scripts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Shellcheck
        run: make test.ci-scripts

  lint-engine:
    name: Lint Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-lint
      - name: Clippy
        run: make lint.engine

  test-engine-gates:
    name: Engine Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-test
      - name: Named correctness gates
        run: make test.engine.gates

  test-engine-suite:
    name: Engine Suite (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-test
      - name: Test suite
        run: make test.engine.suite SHARD=${{ matrix.shard }}/2
        timeout-minutes: 25

  # Informational only, and main only: benchmark wall time on shared runners
  # carries no correctness signal.
  bench-engine:
    name: Engine Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-bench
      - name: Criterion benchmarks
        run: make bench.engine
        timeout-minutes: 20
        continue-on-error: true
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: target/criterion
          retention-days: 30
          if-no-files-found: warn

  test-ai-backend:
    name: Test AI Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.ai_backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ai-backend
      - name: Tests
        run: make test.ai-backend

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Install dependencies
        run: make deps
      - name: Lint
        run: make lint.backend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Start PostgreSQL and set up the database
        run: make setup
      - name: Run tests
        run: make test.backend

  check-migrations-immutable:
    name: Check Migrations Immutable
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for modified migration files
        run: ./.github/scripts/check-migrations-immutable.sh "origin/${{ github.base_ref }}"

  check-migrations:
    name: Check Migration Safety
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List new migrations
        id: new
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          ./.github/scripts/new-migrations.sh "$BASE" > "$RUNNER_TEMP/new-migrations.txt"
          cat "$RUNNER_TEMP/new-migrations.txt"
          if [ -s "$RUNNER_TEMP/new-migrations.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations to check."
          fi
      - uses: ./.github/actions/free-disk
        if: steps.new.outputs.any == 'true'
      - uses: DeterminateSystems/nix-installer-action@v21
        if: steps.new.outputs.any == 'true'
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        if: steps.new.outputs.any == 'true'
      - name: Cache deps
        if: steps.new.outputs.any == 'true'
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
      - name: Install dependencies
        if: steps.new.outputs.any == 'true'
        run: make deps
      - name: Check new migrations for production safety
        if: steps.new.outputs.any == 'true'
        run: |
          while IFS= read -r file; do
            make migrations.check.file FILE="$file"
          done < "$RUNNER_TEMP/new-migrations.txt"

  # The unit pass needs the WASM engine and nothing else, so it shards two ways;
  # the production-build tests need Chromium and the built app, so they stay
  # with the build.
  web-unit:
    name: Web Unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - name: Build WASM engine
        run: make wasm
      - name: Install dependencies
        run: make web.deps
      - name: Unit + integration tests
        run: make test.web.unit SHARD=${{ matrix.shard }}/2

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Build WASM engine
        run: make wasm
      - name: Install dependencies
        run: make web.deps
      - name: Typecheck against its baseline and svelte-check gate
        run: make typecheck.web
      # The runner lacks the system libraries Chromium links against; no make target installs them.
      - name: Install Chromium system dependencies
        run: nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      - name: Build and production-build tests
        run: make test.web.build

  # Five shards of whole spec files balanced by measured duration
  # (web/scripts/e2e-shard.mjs); `workers: 1` stays for WebGL determinism, so
  # the parallelism is across runners.
  e2e:
    name: E2E (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # The WASM glue is gitignored. Without it Vite substitutes a stub solver and
      # the e2e readiness gate (`__stabileo.solverReady()`) fails loudly.
      - name: Build WASM engine
        run: make wasm
      - name: Install dependencies
        run: make web.deps
      - name: Install Chromium
        run: make e2e.web.setup
      - name: Install Chromium system dependencies
        run: nix develop --command bash -c "cd web && npx playwright install-deps chromium"
      # `@landing` stays out: on CI every landing case after the first wedges in
      # `browser.newContext`; run `npx playwright test --grep @landing` locally.
      - name: E2E smoke suite
        run: make e2e.web.smoke SHARD=${{ matrix.shard }}/5
      - name: E2E slow suite
        if: matrix.shard == 1 && (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
        run: make e2e.web.slow
      # Non-blocking until the Linux baselines under web/e2e/__screenshots__/linux/
      # prove stable. Never pass --update-snapshots by default: it would overwrite
      # the baselines and leave the gate inert. UPDATE_SNAPSHOTS=1 refreshes them once.
      - name: E2E visual baselines (non-blocking comparison)
        if: matrix.shard == 1 && (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
        continue-on-error: true
        run: make e2e.web.visual UPDATE_SNAPSHOTS=${{ vars.UPDATE_SNAPSHOTS == '1' && '1' || '' }}
      - name: Upload Linux screenshot baselines / diffs
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-baselines
          path: web/e2e/__screenshots__/linux
          retention-days: 30
          if-no-files-found: ignore
      # Both paths are dot-directories, which upload-artifact skips unless told otherwise.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            web/e2e/.report
            web/e2e/.artifacts
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
