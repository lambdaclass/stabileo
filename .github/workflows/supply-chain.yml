name: Supply chain

# Dependency advisories, licences and sources. Runs on every change to a
# manifest or lockfile, and daily, because new advisories land against
# dependencies that have not changed.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        workspace: ['.', 'desktop/src-tauri']
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # Advisories, licences, banned/duplicate crates and allowed sources,
      # per deny.toml.
      - name: cargo deny
        run: cargo deny --locked --config "$GITHUB_WORKSPACE/deny.toml" check
      # RustSec again through cargo-audit, which also reports yanked crates.
      - name: cargo audit
        run: cargo audit --deny warnings

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        workspace: [web, desktop]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # What ships to users: fail on any high or critical advisory.
      # Retried only when the registry's audit endpoint itself failed (it has, and a rerun was
      # the fix); an advisory fails at once.
      - name: npm audit (including shipped Tauri packages)
        run: |
          for attempt in 1 2 3; do
            out=$(npm audit ${{ matrix.workspace == 'web' && '--omit=dev' || '' }} --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            echo "$out" | grep -qiE 'audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up' || exit 1
            echo "audit endpoint failed (attempt $attempt), retrying"; sleep 20
          done
          exit 1
      - name: Audit shipped web and Tauri closure
        if: matrix.workspace == 'web'
        run: |
          npm audit --json > "$RUNNER_TEMP/web-audit.json" || test -s "$RUNNER_TEMP/web-audit.json"
          node ../desktop/release/audit-web.mjs package-lock.json "$RUNNER_TEMP/web-audit.json"
      # Build and test tooling. Reported, and failing on critical only for
      # packages with a non-breaking fix; see docs/security/AUDIT.md for the
      # dev-only advisories that wait on a major upgrade.
      - name: npm audit (all dependencies, report)
        continue-on-error: true
        run: npm audit --audit-level=high
      # The lockfile must resolve every package from the npm registry, except
      # the explicitly allowed SheetJS tarball (not published to npm).
      - name: lockfile sources
        run: |
          bad=$(grep -oE '"resolved": "[^"]+"' package-lock.json \
            | grep -vE '"resolved": "https://registry\.npmjs\.org/' \
            | grep -vE '"resolved": "https://cdn\.sheetjs\.com/xlsx-[0-9.]+/xlsx-[0-9.]+\.tgz"' || true)
          if [ -n "$bad" ]; then echo "unexpected package sources:"; echo "$bad"; exit 1; fi

  rust:
    if: always()
    needs: rust-audit
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.rust-audit.result }}

  npm:
    if: always()
    needs: npm-audit
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.npm-audit.result }}
