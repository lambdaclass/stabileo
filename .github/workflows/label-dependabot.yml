# Adds the group-specific label that dependabot.yml cannot: `labels` is only
# valid per ecosystem block, not per group, so prod-vs-dev has to be derived
# here. The group name is what Dependabot puts in the branch — renaming a group
# in dependabot.yml means updating the case statement below.
#
# pull_request_target rather than pull_request: a Dependabot-triggered run gets a
# read-only GITHUB_TOKEN and cannot label anything. That trigger is safe here
# only because this workflow never checks out the pull request's code.
name: Label Dependabot PRs

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  label:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label from the Dependabot group name
        env:
          # Branch names are attacker-controlled in the general case, so they are
          # read as environment variables instead of interpolated into the script.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            *security-prod*) label=security ;;
            *security-dev*)  label=dev-deps ;;
            # actions-security intentionally falls through: the DevOps label from
            # dependabot.yml already says everything useful about a workflow bump.
            *)               label="" ;;
          esac
          if [ -z "$label" ]; then
            echo "No group-specific label applies to $BRANCH"
            exit 0
          fi
          gh pr edit "$PR" --repo "$REPO" --add-label "$label"
