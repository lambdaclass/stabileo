name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM engine
        run: wasm-pack build --target web --out-dir ../web/src/lib/wasm --no-opt
        working-directory: engine

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # The build prerenders the public pages by driving the real application in
      # a browser (web/scripts/prerender.ts), so one is needed here. Without it
      # the build fails loudly, which is the intended failure: a deploy that
      # silently skipped prerendering would put the site back to answering 404
      # to every crawler, and nothing on the page would look wrong.
      - name: Install Chromium for prerendering
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /

      - name: Verify the public pages were prerendered
        working-directory: web
        run: |
          # A crawler must receive text, not an empty shell. These four files
          # are the difference between the site being indexable and not, and a
          # prerender that half-ran would leave a build that looks fine.
          for f in index.html es/index.html pt/blog/index.html es/blog/the-determinism-boundary/index.html; do
            test -f "dist/$f" || { echo "prerender missing: dist/$f"; exit 1; }
            chars=$(sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' "dist/$f" | tr -s ' \n' ' ' | wc -c)
            if [ "$chars" -lt 800 ]; then echo "dist/$f carries only $chars characters of text"; exit 1; fi
          done
          test -f dist/sitemap.xml || { echo 'sitemap.xml missing'; exit 1; }
          test -f dist/robots.txt || { echo 'robots.txt missing'; exit 1; }
          echo "prerendered pages verified"

      - name: Verify custom-domain asset paths
        working-directory: web
        run: |
          test -f dist/index.html
          if grep -Eq '="/stabileo/|='\''/stabileo/'\''' dist/index.html; then
            echo "GitHub Pages build emitted /stabileo asset paths on the custom domain."
            echo "Expected root-relative paths like /assets/... for stabileo.com."
            exit 1
          fi
          if ! grep -Eq 'src="/assets/|href="/assets/' dist/index.html; then
            echo "GitHub Pages build did not emit root-relative asset URLs."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
