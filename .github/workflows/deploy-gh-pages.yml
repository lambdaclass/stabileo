name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned, cached and retried rather than `curl | sh`. The installer script
      # downloads from the GitHub releases CDN with no retry, so a single 503
      # there fails the whole deploy — which is what happened on b951e694, the
      # merge of #131: CI passed on the same commit and only the deploy died, so
      # main sat undeployed until someone noticed. It also pins the version,
      # which the script did not: it fetched whatever was current.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM engine
        run: wasm-pack build --target web --out-dir ../web/src/lib/wasm --no-opt
        working-directory: engine

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /

      - name: Verify custom-domain asset paths
        working-directory: web
        run: |
          test -f dist/index.html
          if grep -Eq '="/stabileo/|='\''/stabileo/'\''' dist/index.html; then
            echo "GitHub Pages build emitted /stabileo asset paths on the custom domain."
            echo "Expected root-relative paths like /assets/... for stabileo.com."
            exit 1
          fi
          if ! grep -Eq 'src="/assets/|href="/assets/' dist/index.html; then
            echo "GitHub Pages build did not emit root-relative asset URLs."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
