services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # Loopback only: browsers reach the API through nginx (/api/), which
    # sets X-Real-IP, so the backend can trust it for rate limiting.
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - LOG_FORMAT=json
      - TRUST_PROXY_HEADERS=true
    volumes:
      - web-dist:/app/web-dist
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl; the binary probes itself.
      test: ["CMD", "./backend", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "4000:80"
    volumes:
      - web-dist:/app/web-dist:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web-dist:
