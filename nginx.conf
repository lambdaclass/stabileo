# Included inside nginx's http {} block (conf.d/default.conf), so zone
# declarations are allowed here. 10 AI requests per second per client
# address at the edge; the backend applies its own per-minute limit.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    root /app/web-dist;
    index index.html;

    server_tokens off;

    # Security headers for every response (`always`: errors too).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Report-only until verified against the running app: the prerendered
    # pages carry an inline bootstrap script, the footing CAD hand-off probes
    # a local tool, and #embed= links are meant to be framed. Switch to the
    # enforcing header once the report is clean (see docs/security/AUDIT.md).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.github.com http://127.0.0.1:4179; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Frontend SPA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        # Matches the backend's MAX_BODY_BYTES default.
        client_max_body_size 2m;

        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        # Overwrites anything the client sent; the backend trusts this header
        # for rate limiting when TRUST_PROXY_HEADERS=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # Proxy health check
    location /health {
        proxy_pass http://backend:3001;
    }
}
