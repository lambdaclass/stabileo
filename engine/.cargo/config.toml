[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# There used to be an `[unstable] build-std` here "for a JS-backed Instant::now() in WASM", with an
# engine/rust-toolchain.toml selecting a floating nightly so that cargo would read it. The clocks
# the engine reads in WASM are gated off (`solver/linear.rs`, `now_micros`), so std needs no
# rebuild; the one toolchain is the root rust-toolchain.toml. Under that nightly it rebuilt std for
# every native test build in CI, for nothing.
