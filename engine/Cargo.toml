[package]
name = "dedaliano-engine"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
authors = ["Dedaliano Team"]
# Test binaries are listed below rather than discovered: each top-level tests/*.rs used to be its
# own binary, and building 100+ binaries that each link the engine was most of `cargo test`.
# scripts/check-test-targets.py (CI lint) fails when a test file is in no binary or in two.
autotests = false
description = "High-performance 2D structural analysis engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
parallel = ["rayon"]
manual-bench-phases = []

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde-wasm-bindgen = "0.6"

# Constrained Delaunay triangulation with Ruppert-style quality refinement.
# Used only by the cross-section mesher (section::mesh). Pure Rust, wasm32-clean,
# MIT OR Apache-2.0. Selected over `cdt` in the Checkpoint 2A dependency audit:
# `cdt` handles holes natively but adds no Steiner points, so an L-angle meshes
# as 4 triangles and no convergence study is possible.
spade = { version = "2.15", default-features = false }

# Exact rational arithmetic for the plastic-collapse certificate
# (certify::plastic): equilibrium and mechanism compatibility are checked
# without rounding. Pure Rust, wasm32-clean, MIT OR Apache-2.0.
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint-std", "std"] }
num-traits = "0.2"
num-integer = "0.1"

# Better panic messages in WASM
console_error_panic_hook = { version = "0.1", optional = true }

# For JS console logging
web-sys = { version = "0.3", features = ["console"] }

# Parallel element assembly (optional, not WASM-compatible)
rayon = { version = "1.10", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"
proptest = "1"
# CBOR values hold NaN and ±∞, which JSON cannot: the certificate property
# tests inject them into typed inputs (tests/certify_nonfinite.rs).
ciborium = "0.2"

[[test]]
name = "core"
path = "tests/core/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "reference"
path = "tests/reference/main.rs"

[[test]]
name = "validation"
path = "tests/validation/main.rs"

[[test]]
name = "metamorphic"
path = "tests/metamorphic/main.rs"

[[test]]
name = "property"
path = "tests/property/main.rs"

[[test]]
name = "gates"
path = "tests/gates/main.rs"

[[test]]
name = "certificates"
path = "tests/certificates/main.rs"

[[test]]
name = "shells"
path = "tests/shells/main.rs"

[[test]]
name = "derivations"
path = "tests/derivations/main.rs"

[[test]]
name = "solver"
path = "tests/solver/main.rs"

[[test]]
name = "elements"
path = "tests/elements/main.rs"

[[test]]
name = "robustness"
path = "tests/robustness/main.rs"

[[bench]]
name = "solver_bench"
harness = false

[[bench]]
name = "assembly_bench"
harness = false

[[bench]]
name = "workflow_bench"
harness = false

[[bench]]
name = "pcg_bench"
harness = false

[[bench]]
name = "eigen_bench"
harness = false

[profile.release]
opt-level = 3
lto = true

[profile.test]
opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
