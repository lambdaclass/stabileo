[package]
name = "gridshell-fairclough-2026"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["engine-check"]
engine-check = ["dep:dedaliano-engine"]

[dependencies]
libm = "=0.2.16"
clarabel = { version = "=0.11.1", default-features = false, features = ["serde"] }
dedaliano-engine = { path = "../../../engine", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.test]
opt-level = 2
