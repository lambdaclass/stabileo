    - Ole Sigmund
    year: 2025
    venue: International Journal for Numerical Methods in Engineering
  area: optimization
  keywords:
  - post-buckling
  - Koiter asymptotic theory
  - imperfection sensitivity
  - trusses
  - frames
  summary: Uses Koiter's asymptotic post-buckling expansion in sizing and topology optimization of trusses
    and frames. Constraining the first two asymptotic coefficients (initial post-buckling slope and curvature)
    shapes the post-buckling response and lowers imperfection sensitivity, and the same expansion approximates
    the nonlinear response so that measures such as end-compliance can be optimized.
  summary_source: crossref-abstract
  code: []
  data: []
  methods:
  - linear buckling eigenproblem
  - Koiter asymptotic expansion
  - corotational beams
  - arc-length path following
  dependencies: []
  complexity: medium
  relevance: Production buckling reproduces the simple Roorda frame load factor; element energy derivatives
    are checked through order four. Koiter coefficients and near-bifurcation path agreement remain unresolved.
    No public author code was run.
  status: implementation-in-progress
  reproduced_published_results: false
  benchmarks:
  - Simple Roorda frame, Section 2.1.2; buckling load only
  implementation: stability/ferrari-sigmund-2025
  page: web/src/components/research/ferrari2025/FerrariPage.svelte
  contacts: []
- id: zmyslony-2026
  doi: 10.1103/56f8-8gsx
  crossref:
    title: Snapping and switching of elastic arches with patterned preferred curvature
    authors:
    - Michał Zmyślony
    - Ammar Khan
    - John S. Biggins
    year: 2026
    venue: Physical Review Research
  area: metamaterials
  keywords:
  - elastic arch
  - snap-through
  - bistability
  - preferred curvature
  - Euler buckling modes
  summary: Elastica theory and photomechanical experiments on an arch whose preferred curvature varies
    along its length and in time. A shallow-arch theory projects the curvature pattern onto Euler buckling
    modes; overlap with the fundamental mode makes the arch snap, other patterns give a continuous switch
    to a higher mode. Patterns with the largest energy release and the lowest threshold are found, and
    the same control applies to passive pre-curved arches loaded at the boundaries.
  summary_source: crossref-abstract
  code: []
  data:
  - url: https://doi.org/10.5281/zenodo.18256271
    license: CC-BY-4.0
  methods:
  - shallow-arch elastica theory
  - Euler buckling mode decomposition
  - experiments
  dependencies: []
  complexity: low
  relevance: Queue item 5. The theory's basis is the Euler buckling modes the production engine already
    computes. Centered-pattern shallow-arch thresholds are checked against Zenodo software outputs. Production
    arc-length rejects thermal loading and prescribed displacements; the curvature-driven equilibrium
    path uses a research modal layer. Experimental snap dynamics are not reproduced.
  status: interactive
  reproduced_published_results: true
  benchmarks: []
  implementation: mechanics/biggins-2026
  page: web/src/components/research/biggins2026/BigginsPage.svelte
  contacts: []
