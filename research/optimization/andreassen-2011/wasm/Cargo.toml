[package]
name = "topopt-andreassen-2011-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
topopt-andreassen-2011 = { path = ".." }
wasm-bindgen = "=0.2.129"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
