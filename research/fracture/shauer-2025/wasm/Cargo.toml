[package]
name = "phasefield-shauer-2025-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Browser bundle for the Stabileo Research phase-field page; loaded only on /research"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
phasefield-shauer-2025 = { path = ".." }
wasm-bindgen = "=0.2.129"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
