[package]
name = "phasefield-shauer-2025"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Stabileo Research: AT2 phase-field fracture after Shauer (2025), validated against the reference code"

# Its own workspace: not a member of the engine's, so the engine's lockfile, builds and CI are unchanged.
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
dedaliano-engine = { path = "../../../engine", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3
