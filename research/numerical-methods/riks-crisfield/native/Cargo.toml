[package]
name = "riks-crisfield-evidence"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Shared native evidence for the production Riks/Crisfield arc-length solver"

[workspace]

[dependencies]
dedaliano-engine = { path = "../../../../engine", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
