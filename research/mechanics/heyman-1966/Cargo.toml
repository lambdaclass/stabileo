[package]
name = "masonry-arches-heyman-1966"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
