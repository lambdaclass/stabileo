id: grossman-2026
doi: 10.1103/17sg-gzhl
reference_code: null   # "available at request" (Data Availability); none public
license_of_paper: CC-BY-4.0
equations: README.md#formulation
assumptions: [linear response about equilibrium, small strain, quasi-static, 2D, central-force Hookean springs (Eq. 3), unit spacing and k = 1 unless stated]
units: {length: lattice spacing, stiffness: k, moduli: k (2D, force per length)}
experiments:
  - name: foam-auxetic
    inputs: {lattice: triangular phi = psi = 1, eta: [0, 0.5], samples: 10, spring_law: equal k}
    mesh: {periodic: 26 x 26 cells, strip: 0 <= x <= 13, 0 <= y <= 52}
    solver: {regularisation: adaptive 1e-10 to 1e-14 max diag, refinement_steps_max: 128}
    references: [reference-results/fig5_simulation_digitized.csv, reference-results/paper_values.json#foam_poisson_ratio]
  - name: honeycomb-eq23
    inputs: {l: [0.05, 0.95], k_radial: [1e-3, 1e-6]}
    mesh: {periodic: 4 x 4 cells}
    solver: {regularisation: adaptive 1e-10 to 1e-14 max diag, refinement_steps_max: 128}
    references: [reference-results/paper_values.json#honeycomb_poisson_ratio]
  - name: ordered-lattices
    inputs: {cases: [[2, 2], [3, 0.9], [1, 1], [1.5, 1], [1, 0.5], [2, 0.5], [3, 2]], spring_law: [equal k, k ∝ 1/l^2]}
    mesh: {periodic: 4 x 4 cells}
    references: [Supplemental Eq. (9), reference-results/paper_figures_vector.json#fig7]
  - name: rigidity-dilution
    inputs: {keep: [0.4, 1.0], samples: 6}
    mesh: {periodic: 24 x 24 cells}
    references: [Maxwell counting z = 4 (independent of the paper)]
environment:
  rust: 1.99.1 (rust-toolchain.toml)
  linear_solver: dedaliano-engine supernodal sparse Cholesky, AMD ordering
  cross_check: dedaliano-engine solve_2d (2D truss) on the same strip
  reference: reference-results/MANIFEST.json
