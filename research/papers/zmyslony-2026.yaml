summary: Elastica theory and photomechanical experiments on an arch whose preferred curvature varies along
  its length and in time. A shallow-arch theory projects the curvature pattern onto Euler buckling modes;
  overlap with the fundamental mode makes the arch snap, other patterns give a continuous switch to a
  higher mode. Patterns with the largest energy release and the lowest threshold are found, and the same
  control applies to passive pre-curved arches loaded at the boundaries.
