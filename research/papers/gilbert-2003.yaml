summary: Ground-structure layout optimization of trusses is limited by the number of potential members.
  The paper presents an iterative member-adding method, built on linear-programming column generation,
  that starts from a sparsely connected ground structure and adds members as needed until the provably
  optimal layout is reached, handling problems with very large numbers of potential members.
