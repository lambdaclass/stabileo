summary: Derives the elastic continuum of an arbitrary network of Hookean springs from its geometry and
  topology alone, with the nonaffine deformation of every triangle obtained from a linear system, and
  compares the resulting Poisson's ratios and Young's moduli with simulations of stretched strips of ordered
  triangular lattices, a honeycomb that turns re-entrant, and a foam-like disordered lattice that becomes
  auxetic.
