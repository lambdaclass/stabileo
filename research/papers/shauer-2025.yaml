summary: An educational single-file Python implementation of two-dimensional phase-field fracture with
  linear quadrilateral elements. It provides sparse and dense examples of a bar in tension and a single-edge
  notched plate, plus a sparse three-point bending example, with VTK output and stress or reaction-force
  plots for comparison.
