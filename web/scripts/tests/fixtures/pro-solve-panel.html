<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>PRO solve refusal</title></head>
  <body>
    <main></main>
    <script type="module">
      import { mount } from 'svelte';
      import ProPanel from '../../../src/components/pro/ProPanel.svelte';
      import { modelStore, uiStore } from '../../../src/lib/store';
      import { createPlate, meshBeforeAnalysis } from '../../../src/lib/store/physical-plates';
      import { setLocale } from '../../../src/lib/i18n';
      import '../../../src/lib/i18n/full-dictionaries';

      setLocale('en');
      modelStore.clear();
      uiStore.analysisMode = 'pro';
      const outline = [[0, 0], [2, 0], [2, 2], [0, 2]].map(([x, y]) => modelStore.addNode(x, y, 0));
      for (const [index, id] of outline.entries()) {
        modelStore.addElement(id, outline[(index + 1) % outline.length], 'frame');
        modelStore.addSupport(id, 'fixed');
      }
      const result = createPlate({ outline, materialId: 1, thickness: 0.15 });
      if ('problem' in result) throw Error(result.problem);
      meshBeforeAnalysis.value = false;
      const panel = mount(ProPanel, { target: document.querySelector('main') });
      window.runPanelSolve = () => panel.solve();
      window.clearSolveToasts = () => {
        const error = uiStore.toasts.findLast(toast => toast.type === 'error')?.message;
        for (const toast of [...uiStore.toasts]) uiStore.dismissToast(toast.id);
        return error;
      };
    </script>
  </body>
</html>
