<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Query export fixture</title></head>
<body>
<div id="results"></div>
<pre id="checks"></pre>
<script type="module">
import { mount, tick } from 'svelte';
import ProResultsTab from '/src/components/pro/ProResultsTab.svelte';
import { computeEnvelope3D, initSolver } from '/src/lib/engine/wasm-solver.ts';
import { ensureLocale, setLocale, t } from '/src/lib/i18n/index.ts';
import '/src/lib/i18n/full-dictionaries.ts';
import { modelStore, resultsStore, uiStore } from '/src/lib/store/index.ts';

await ensureLocale('en');
setLocale('en');
await initSolver();
uiStore.analysisMode = 'pro';
const start = modelStore.addNode(0, 0, 0);
const end = modelStore.addNode(4, 0, 0);
const member = modelStore.addElement(start, end, 'frame');
modelStore.addSupport(start, 'fixed3d');
modelStore.addNodalLoad3D(end, 10, 0, 0, 0, 0, 0);
const result = modelStore.solve3D();
if (!result || typeof result === 'string') throw new Error(String(result));
resultsStore.setResults3D(result);
resultsStore.diagramType = 'axial';

const captured = [];
const createObjectURL = URL.createObjectURL.bind(URL);
URL.createObjectURL = blob => {
  if (blob.type.startsWith('text/csv')) captured.push(blob.text());
  return createObjectURL(blob);
};
window.showSaveFilePicker = undefined;
HTMLAnchorElement.prototype.click = () => {};

mount(ProResultsTab, { target: document.getElementById('results') });
await tick();
document.querySelector('[data-testid=res-tab-query]').click();
await tick();
const button = document.querySelector('.pro-query-export');
const readRefusal = async () => {
  await tick();
  const table = document.querySelector('.pro-query-empty[role=status]')?.textContent.trim();
  const disabled = button.disabled;
  const previous = uiStore.toasts.length;
  button.disabled = false;
  button.click();
  button.disabled = disabled;
  return { table, disabled, export: uiStore.toasts[previous]?.message ?? null };
};

resultsStore.activeView = 'envelope';
const missing = await readRefusal();
const envelope = computeEnvelope3D([result]);
const detached = structuredClone(envelope);
resultsStore.setCombinationResults3D(new Map([[1, result]]), new Map(), detached);
resultsStore.activeView = 'envelope';
const unbound = await readRefusal();

resultsStore.setCombinationResults3D(new Map([[1, result]]), new Map(), envelope);
resultsStore.activeView = 'envelope';
await tick();
const validEnabled = !button.disabled;
const startCapture = captured.length;
button.click();
const deadline = performance.now() + 8000;
while (captured.length === startCapture && performance.now() < deadline) {
  await new Promise(requestAnimationFrame);
}
const files = (await Promise.all(captured)).map(csv => csv.split('\n').filter(line => !line.startsWith('#')));
document.getElementById('checks').textContent = JSON.stringify({
  missing, unbound, validEnabled, member, files, message: t('solver.diagramExtremaUnavailable'),
});
</script>
</body>
</html>
