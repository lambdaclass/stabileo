<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stabileo</title>
    <script>
      (function () {
        // The fragment stays a fragment. Folded into the query it reached the
        // server, and a shared model's #data=... (thousands of characters) got
        // a 414 URI Too Long from the host before the app could read it.
        var route = window.location.pathname + window.location.search;
        window.location.replace('/?route=' + encodeURIComponent(route) + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
