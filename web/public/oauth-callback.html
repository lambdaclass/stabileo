<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stabileo</title>
<style>body{font:15px system-ui,sans-serif;margin:48px auto;max-width:320px;padding:0 16px;text-align:center;color:#444}</style>
</head>
<body>
<p id="m">Stabileo</p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var msg = { type: 'stabileo-oauth' };
  if (q.get('code')) msg.code = q.get('code'); else msg.error = q.get('error') || 'callback_failed';
  if (q.get('attempt')) msg.attempt = q.get('attempt');
  try { var c = new BroadcastChannel('stabileo-oauth'); c.postMessage(msg); c.close(); } catch (e) {}
  try { if (window.opener) window.opener.postMessage(msg, location.origin); } catch (e) {}
  try { localStorage.setItem('stabileo-oauth-result', JSON.stringify(msg)); localStorage.removeItem('stabileo-oauth-result'); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  var l = (navigator.language || 'en').slice(0, 2);
  var t = { es: 'Listo. Podés cerrar esta ventana.', pt: 'Pronto. Pode fechar esta janela.', de: 'Fertig. Sie können dieses Fenster schließen.', fr: 'C’est fait. Vous pouvez fermer cette fenêtre.', tr: 'Tamam. Bu pencereyi kapatabilirsiniz.' };
  document.getElementById('m').textContent = t[l] || 'Done. You can close this window.';
  setTimeout(function () { window.close(); }, 150);
})();
</script>
</body>
</html>
