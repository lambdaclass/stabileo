<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!--
      STATIC METADATA — the only metadata a crawler that does not run
      JavaScript ever sees, because the landing is client-rendered. It is
      therefore the English source of truth and must stay correct on its own.
      LandingPage.svelte does not append a second copy of these tags; it
      rewrites them in place after hydration (and back on unmount), so there is
      never a duplicate or a contradiction in the document.
    -->
    <meta
      name="description"
      content="Free and open-source 2D and 3D structural analysis that runs in your browser. The solver runs on your machine — no install, no licence key, no account."
    />
    <meta name="theme-color" content="#0c1620" />
    <link rel="canonical" href="https://stabileo.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stabileo" />
    <meta property="og:url" content="https://stabileo.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_AR" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:title" content="Stabileo — Structural analysis, in a browser tab." />
    <meta
      property="og:description"
      content="Free and open-source 2D and 3D structural analysis that runs in your browser. The solver runs on your machine — no install, no licence key, no account."
    />
    <!--
      Absolute, because crawlers do not reliably resolve relative og:image URLs.
      Safe for the deploy check in .github/workflows/deploy-gh-pages.yml, which
      rejects GitHub project-page asset prefixes on the custom domain; an
      https:// URL is not one. (That check greps the built HTML, so this note
      deliberately avoids spelling the rejected prefix out and tripping it.)
      PNG, because it is the format every crawler accepts; the landing's AVIF
      and WebP derivatives are deliberately not used here.
    -->
    <meta property="og:image" content="https://stabileo.com/og/stabileo-social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Stabileo — structural analysis, in a browser tab. A simply supported truss with members coloured by axial force: red in tension, blue in compression."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stabileo — Structural analysis, in a browser tab." />
    <meta
      name="twitter:description"
      content="Free and open-source 2D and 3D structural analysis that runs in your browser. The solver runs on your machine — no install, no licence key, no account."
    />
    <meta name="twitter:image" content="https://stabileo.com/og/stabileo-social.png" />
    <meta
      name="twitter:image:alt"
      content="Stabileo — structural analysis, in a browser tab. A simply supported truss with members coloured by axial force: red in tension, blue in compression."
    />
    <!-- The production icon, and the only one this file names. The
         development variant is swapped in from src/main.ts, behind a
         build-time flag; see the note there for why it cannot live here. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stabileo — Structural analysis, in a browser tab.</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
